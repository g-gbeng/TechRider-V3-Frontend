<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Repair Request</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --gray:#f6f6f6;
      --white:#fff;
    }

    body{
      background:var(--gray);
      min-height:100vh;
      padding:15px;
      display:flex;
      justify-content:center;
      animation:fadeIn 0.6s ease-in;
    }

    .container{
      width:100%;
      max-width:900px;
      background:var(--white);
      border-radius:18px;
      padding:20px;
      box-shadow:0 15px 40px rgba(0,0,0,0.08);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
      gap:10px;
    }

    .header h2{
      color:var(--deep-purple);
    }

    .back-btn{
      text-decoration:none;
      background:var(--purple);
      color:white;
      padding:10px 14px;
      border-radius:10px;
      font-size:0.85rem;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:#444;
      font-weight:500;
    }

    input, select, textarea{
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:0.9rem;
    }

    textarea{
      resize:none;
      min-height:100px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .btn{
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      color:white;
      font-weight:600;
      cursor:pointer;
      font-size:1rem;
    }

    .btn:hover{opacity:0.9;}

    @media(max-width:768px){
      .grid{grid-template-columns:1fr;}
      .back-btn{width:100%;text-align:center;}
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>Request a Repair</h2>
      <a href="dashboard-customer.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <form class="form" id="repairForm">

      <div class="group">
        <label>Device Type</label>
        <select id="deviceType" required>
          <option value="">Select device</option>
          <option>Laptop</option>
          <option>Phone</option>
        </select>
      </div>

      <div class="grid">
        <div class="group">
          <label>Brand</label>
          <input id="brand" type="text" placeholder="e.g. Apple, Samsung" required>
        </div>

        <div class="group">
          <label>Model</label>
          <input id="model" type="text" placeholder="Device model" required>
        </div>
      </div>

      <div class="group">
        <label>Issue Description</label>
        <textarea id="description" placeholder="Describe the problem in detail..." required></textarea>
      </div>

      <div class="group">
        <label>Location</label>
        <input id="location" type="text" placeholder="Your location" required>
      </div>

      <div class="group">

  <label>
    Upload Device Images 
  </label>

  <input
    type="file"
    id="deviceImages"
    accept="image/*"
    multiple
  >

  <small
    id="imageInfo"
    style="
      color:#666;
      font-size:.8rem;
    ">

    You can upload up to 4 images

  </small>

  <!-- IMAGE PREVIEW -->

  <div
    id="previewContainer"
    style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:10px;
    ">

  </div>

</div>


      <button class="btn" type="submit">
        Select Technician
      </button>

    </form>

  </div>

  <script>

const form =
document.getElementById(
'repairForm'
);

const imageInput =
document.getElementById(
'deviceImages'
);

const previewContainer =
document.getElementById(
'previewContainer'
);

/* =========================================
STORE BASE64 IMAGES
========================================= */

let uploadedImages = [];

/* =========================================
IMAGE PREVIEW + CONVERT TO BASE64
========================================= */

imageInput.addEventListener(
'change',
function(){

const files =
Array.from(this.files);

previewContainer.innerHTML = '';

uploadedImages = [];

/* LIMIT TO 4 */

if(files.length > 4){

alert(
'You can upload a maximum of 4 images.'
);

imageInput.value = '';

return;

}

files.forEach(file => {

if(
!file.type.startsWith('image/')
){
return;
}

const reader =
new FileReader();

reader.onload = function(e){

/* SAVE BASE64 */

uploadedImages.push(
e.target.result
);

/* PREVIEW */

const img =
document.createElement('img');

img.src =
e.target.result;

img.style.width = '100%';
img.style.height = '120px';
img.style.objectFit = 'cover';
img.style.borderRadius = '10px';
img.style.border = '1px solid #ddd';

previewContainer.appendChild(img);

};

reader.readAsDataURL(file);

});

}
);

/* =========================================
SUBMIT FORM
========================================= */

form.addEventListener(
'submit',
function(e){

e.preventDefault();

const currentCustomer =
JSON.parse(
localStorage.getItem(
'techrider_current_customer'
)
);

if(!currentCustomer){

alert(
"Please login again"
);

window.location.href =
"login-customer.html";

return;

}

/* =========================================
CREATE REQUEST
========================================= */

const request = {

id: Date.now(),

customerId:
currentCustomer.id,

customerName:
currentCustomer.fullName,

customerEmail:
currentCustomer.email,

customerPhone:
currentCustomer.phone,

deviceType:
document.getElementById(
'deviceType'
).value,

brand:
document.getElementById(
'brand'
).value,

model:
document.getElementById(
'model'
).value,

description:
document.getElementById(
'description'
).value,

location:
document.getElementById(
'location'
).value,

/* NEW IMAGE FIELD */

deviceImages:
uploadedImages,

status:"pending",

createdAt:
new Date().toISOString(),

assignedTechnician:null

};

/* =========================================
SAVE TO REQUESTS
========================================= */

const requests =
JSON.parse(
localStorage.getItem(
'techrider_requests'
)
) || [];

requests.push(request);

localStorage.setItem(
'techrider_requests',
JSON.stringify(requests)
);

/* =========================================
SAVE PENDING REQUEST
========================================= */

localStorage.setItem(
'techrider_pending_request',
JSON.stringify(request)
);

/* =========================================
GO TO SELECT TECHNICIAN
========================================= */

window.location.href =
"select-technician.html";

}
);

</script>

</body>
</html>
