<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Repair Request</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --gray:#f6f6f6;
      --white:#fff;
    }

    body{
      background:var(--gray);
      min-height:100vh;
      padding:15px;
      display:flex;
      justify-content:center;
      animation:fadeIn 0.6s ease-in;
    }

    .container{
      width:100%;
      max-width:900px;
      background:var(--white);
      border-radius:18px;
      padding:20px;
      box-shadow:0 15px 40px rgba(0,0,0,0.08);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      flex-wrap:wrap;
      gap:10px;
    }

    .header h2{
      color:var(--deep-purple);
    }

    .back-btn{
      text-decoration:none;
      background:var(--purple);
      color:white;
      padding:10px 14px;
      border-radius:10px;
      font-size:0.85rem;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:#444;
      font-weight:500;
    }

    input, select, textarea{
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:0.9rem;
    }

    textarea{
      resize:none;
      min-height:100px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .btn{
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      color:white;
      font-weight:600;
      cursor:pointer;
      font-size:1rem;
    }

    .btn:hover{opacity:0.9;}

    @media(max-width:768px){
      .grid{grid-template-columns:1fr;}
      .back-btn{width:100%;text-align:center;}
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>Request a Repair</h2>
      <a href="dashboard-customer.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <form class="form" id="repairForm">

      <div class="group">
        <label>Device Type</label>
        <select id="deviceType" required>
          <option value="">Select device</option>
          <option>Laptop</option>
          <option>Phone</option>
        </select>
      </div>

      <div class="grid">
        <div class="group">
          <label>Brand</label>
          <input id="brand" type="text" placeholder="e.g. Apple, Samsung" required>
        </div>

        <div class="group">
          <label>Model</label>
          <input id="model" type="text" placeholder="Device model" required>
        </div>
      </div>

      <div class="group">
        <label>Issue Description</label>
        <textarea id="description" placeholder="Describe the problem in detail..." required></textarea>
      </div>

      <div class="group">
        <label>Location</label>
        <input id="location" type="text" placeholder="Your location" required>
      </div>

      <div class="group">

  <label>
    Upload Device Images 
  </label>

  <input
    type="file"
    id="deviceImages"
    accept="image/*"
    multiple
  >

  <small
    id="imageInfo"
    style="
      color:#666;
      font-size:.8rem;
    ">

    You can upload up to 4 images

  </small>

  <!-- IMAGE PREVIEW -->

  <div
    id="previewContainer"
    style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:10px;
    ">

  </div>

</div>


      <button class="btn" type="submit">
        Select Technician
      </button>

    </form>

  </div>

  <script>

/* ==========================================
    DOM REFERENCES
========================================== */

const form = document.getElementById("repairForm");

const imageInput =
document.getElementById("deviceImages");

const previewContainer =
document.getElementById("previewContainer");

/* ==========================================
    STORAGE KEYS
========================================== */

const REQUESTS_KEY =
"techrider_requests";

const CURRENT_CUSTOMER_KEY =
"techrider_current_customer";

/* ==========================================
    IMAGE STORAGE
========================================== */

let uploadedImages = [];

/* ==========================================
    ACCOUNT SUSPENSION CHECK
========================================== */

const currentCustomer = JSON.parse(
    localStorage.getItem("techrider_current_customer")
);

if (!currentCustomer) {

    alert("Please login again.");

    window.location.replace("login-customer.html");

    throw new Error("No customer session found.");

}

/* --------------------------
CHECK IF CUSTOMER IS SUSPENDED
--------------------------- */

const customers = JSON.parse(
    localStorage.getItem("techrider_customers")
) || [];

const currentRecord = customers.find(customer => {

    /* First try ID */

    if (
        customer.id &&
        currentCustomer.id &&
        String(customer.id) === String(currentCustomer.id)
    ) {
        return true;
    }

    /* Fall back to email */

    return (
        (customer.email || "").toLowerCase() ===
        (currentCustomer.email || "").toLowerCase()
    );

});

console.log("Current Customer:", currentCustomer);
console.log("Matched Customer:", currentRecord);
console.log("Suspended:", currentRecord?.suspended);

if (currentRecord?.suspended) {

    window.location.replace("account-suspended.html");

    throw new Error("Customer account is suspended.");

}
/* ==========================================
    IMAGE COMPRESSION
========================================== */

function compressImage(file){

return new Promise((resolve,reject)=>{

if(!file.type.startsWith("image/")){

reject("Invalid file");

return;

}

const reader =
new FileReader();

reader.onload = function(e){

const img =
new Image();

img.onload = function(){

const canvas =
document.createElement("canvas");

const ctx =
canvas.getContext("2d");

let width =
img.width;

let height =
img.height;

const MAX_SIZE = 900;

/* Keep aspect ratio */

if(width>height){

if(width>MAX_SIZE){

height *= MAX_SIZE/width;
width = MAX_SIZE;

}

}else{

if(height>MAX_SIZE){

width *= MAX_SIZE/height;
height = MAX_SIZE;

}

}

canvas.width = width;
canvas.height = height;

ctx.drawImage(

img,

0,
0,

width,
height

);

/* Same quality used elsewhere */

resolve(

canvas.toDataURL(

"image/jpeg",

0.7

)

);

};

img.onerror = reject;

img.src =
e.target.result;

};

reader.onerror = reject;

reader.readAsDataURL(file);

});

}

/* ==========================================
    IMAGE SELECTION
========================================== */

imageInput.addEventListener(

"change",

async function(){

previewContainer.innerHTML = "";

uploadedImages = [];

const files =
Array.from(this.files);

if(files.length>4){

alert(

"You can upload a maximum of 4 images."

);

this.value="";

return;

}

for(const file of files){

try{

const compressed =

await compressImage(file);

uploadedImages.push(

compressed

);

/* Preview */

const img =
document.createElement("img");

img.src = compressed;

img.style.width="100%";
img.style.height="120px";
img.style.objectFit="cover";
img.style.borderRadius="10px";
img.style.border="1px solid #ddd";

previewContainer.appendChild(img);

}catch(err){

console.error(err);

}

}

});

/* ==========================================
    SUBMIT REPAIR REQUEST
========================================== */

form.addEventListener(

"submit",

function(e){

e.preventDefault();

/* -----------------------------
   CUSTOMER SESSION
------------------------------ */

const currentCustomer = JSON.parse(

localStorage.getItem(
CURRENT_CUSTOMER_KEY)

);

if(!currentCustomer){

alert("Please login again.");

window.location.href =
"login-customer.html";

return;

}

/* -----------------------------
   BUILD REQUEST OBJECT
------------------------------ */

const request = {

id: Date.now().toString(),

customerId:
currentCustomer.id,

customerName:
currentCustomer.fullName,

customerEmail:
currentCustomer.email,

customerPhone:
currentCustomer.phone || "",

deviceType:
document.getElementById("deviceType").value,

brand:
document.getElementById("brand").value.trim(),

model:
document.getElementById("model").value.trim(),

description:
document.getElementById("description").value.trim(),

location:
document.getElementById("location").value.trim(),

deviceImages:
uploadedImages,

status:"pending",

assignedTechnician:null,

assignedRider:null,

completedAt:null,

cancelledAt:null,

createdAt:
new Date().toISOString()

};

/* -----------------------------
   SAVE REQUEST
------------------------------ */

const requests =

JSON.parse(

localStorage.getItem(
REQUESTS_KEY)

) || [];

requests.push(request);

localStorage.setItem(

REQUESTS_KEY,

JSON.stringify(requests)

);

/* -----------------------------
   UPDATE CUSTOMER REQUEST COUNT
------------------------------ */

const customers =

JSON.parse(

localStorage.getItem(
"techrider_customers")

) || [];

const customerIndex = customers.findIndex(

c=>String(c.id)===String(currentCustomer.id)

);

if(customerIndex!==-1){

customers[customerIndex].requestCount =

(customers[customerIndex].requestCount || 0)+1;

customers[customerIndex].lastRequestId =
request.id;

customers[customerIndex].lastRequestDate =
request.createdAt;

localStorage.setItem(

"techrider_customers",

JSON.stringify(customers)

);

}

/* -----------------------------
   KEEP SESSION UPDATED
------------------------------ */

currentCustomer.requestCount =

(currentCustomer.requestCount || 0)+1;

localStorage.setItem(

CURRENT_CUSTOMER_KEY,

JSON.stringify(currentCustomer)

);

/* -----------------------------
   SAVE ACTIVE REQUEST
------------------------------ */

localStorage.setItem(

"techrider_pending_request",

JSON.stringify(request)

);

/* -----------------------------
   SUCCESS
------------------------------ */


/* -----------------------------
   CONTINUE FLOW
------------------------------ */

window.location.href =
"select-technician.html";

});

/* ==========================================
    HELPER FUNCTIONS
========================================== */

/*
    Return every repair request
*/
function getAllRequests(){

    return JSON.parse(

        localStorage.getItem(
            REQUESTS_KEY
        )

    ) || [];

}

/*
    Return requests for one customer
*/
function getCustomerRequests(customerId){

    return getAllRequests().filter(

        request =>

            String(request.customerId) ===
            String(customerId)

    );

}

/*
    Recalculate every customer's
    request count from scratch.

    This keeps old accounts
    compatible with the new system.
*/
function syncCustomerRequestCounts(){

    const customers = JSON.parse(

        localStorage.getItem(
            "techrider_customers"
        )

    ) || [];

    const requests = getAllRequests();

    customers.forEach(customer=>{

        customer.requestCount = requests.filter(

            request =>

                String(request.customerId) ===
                String(customer.id)

        ).length;

    });

    localStorage.setItem(

        "techrider_customers",

        JSON.stringify(customers)

    );

}

/*
    Run once whenever this page opens.
*/
syncCustomerRequestCounts();

/* ==========================================
    PAGE INITIALIZATION
========================================== */

document.addEventListener(

    "DOMContentLoaded",

    ()=>{

        /*
            Clear previous previews
        */

        previewContainer.innerHTML = "";

        /*
            Reset uploaded images
        */

        uploadedImages = [];

    }

);

</script>

</body>
</html>
