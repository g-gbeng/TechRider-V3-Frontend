<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Repair Request</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/repair-request.css">
  <script src="js/api.js" data-require-role="customer"></script>
<script src="js/ui.js"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>Request a Repair</h2>
      <a href="dashboard-customer.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <form class="form" id="repairForm" novalidate>

      <!-- 1. DEVICE -->
      <fieldset class="section">
        <legend><span class="step-no">1</span> Your device</legend>

        <div class="group">
          <label for="deviceType">Device type</label>
          <select id="deviceType" required>
            <option value="">Select device</option>
            <option>Phone</option>
            <option>Laptop</option>
            <option>Tablet</option>
            <option>Smartwatch</option>
            <option>Desktop</option>
            <option>Other</option>
          </select>
        </div>

        <div class="grid">
          <div class="group">
            <label for="brand">Brand</label>
            <input id="brand" type="text" placeholder="e.g. Apple, Samsung, HP" maxlength="60" required>
          </div>
          <div class="group">
            <label for="model">Model</label>
            <input id="model" type="text" placeholder="e.g. iPhone 12, EliteBook 840" maxlength="80" required>
          </div>
        </div>
      </fieldset>

      <!-- 2. PROBLEM -->
      <fieldset class="section">
        <legend><span class="step-no">2</span> What's wrong?</legend>
        <p class="hint">Tick everything that applies. It helps the technician price the repair faster.</p>

        <div class="fault-chips" id="faultChips" role="group" aria-label="Common problems"></div>

        <div class="group">
          <label for="description" id="descriptionLabel">Anything else we should know? <span class="optional">(optional)</span></label>
          <textarea id="description" maxlength="1500" placeholder="e.g. It fell yesterday, the screen flickers and the battery dies by noon"></textarea>
        </div>

        <div class="group">
          <label for="deviceImages">Photos of the device <span class="optional">(optional, up to 4)</span></label>
          <input type="file" id="deviceImages" accept="image/*" multiple>
          <div id="previewContainer" class="preview-grid"></div>
        </div>
      </fieldset>

      <!-- 3. ADDRESS -->
      <fieldset class="section">
        <legend><span class="step-no">3</span> Pickup and return address</legend>

        <div class="locate-bar" id="locateBar">
          <button type="button" class="locate-btn" id="useLocationBtn">
            <i class="fas fa-location-crosshairs"></i> Use my current location
          </button>
          <span class="locate-status" id="locateStatus" aria-live="polite"></span>
        </div>

        <div class="group">
          <label for="street">House number and street</label>
          <input id="street" type="text" autocomplete="street-address" placeholder="e.g. 12 Allen Avenue" maxlength="120" required>
        </div>

        <div class="grid">
          <div class="group">
            <label for="area">Area / city</label>
            <input id="area" type="text" autocomplete="address-level2" placeholder="e.g. Ikeja" maxlength="60" required>
          </div>
          <div class="group">
            <label for="state">State</label>
            <select id="state" autocomplete="address-level1" required>
              <option value="">Select state</option>
            </select>
          </div>
        </div>

        <div class="grid">
          <div class="group">
            <label for="landmark">Nearest landmark <span class="optional">(optional)</span></label>
            <input id="landmark" type="text" placeholder="e.g. Opposite First Bank" maxlength="120">
          </div>
          <div class="group">
            <label for="contactPhone">Phone for the rider <span class="optional">(if not yours)</span></label>
            <input id="contactPhone" type="tel" inputmode="numeric" placeholder="11 digits" maxlength="11">
          </div>
        </div>
      </fieldset>

      <div class="form-error" id="formError" role="alert"></div>

      <button class="btn" type="submit">
        Continue: choose a technician <i class="fas fa-arrow-right"></i>
      </button>

    </form>

  </div>

  <script src="js/location.js"></script>
  <script src="js/pages/repair-request.js"></script>

</body>
</html>
