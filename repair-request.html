<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Repair Request</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/repair-request.css">
  <script src="js/api.js" data-require-role="customer"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>Request a Repair</h2>
      <a href="dashboard-customer.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <form class="form" id="repairForm">

      <div class="group">
        <label>Device Type</label>
        <select id="deviceType" required>
          <option value="">Select device</option>
          <option>Laptop</option>
          <option>Phone</option>
        </select>
      </div>

      <div class="grid">
        <div class="group">
          <label>Brand</label>
          <input id="brand" type="text" placeholder="e.g. Apple, Samsung" required>
        </div>

        <div class="group">
          <label>Model</label>
          <input id="model" type="text" placeholder="Device model" required>
        </div>
      </div>

      <div class="group">
        <label>Issue Description</label>
        <textarea id="description" placeholder="Describe the problem in detail..." required></textarea>
      </div>

      <div class="group">
        <label>Location</label>
        <input id="location" type="text" placeholder="Your location" required>
      </div>

      <div class="group">

  <label>
    Upload Device Images 
  </label>

  <input
    type="file"
    id="deviceImages"
    accept="image/*"
    multiple
  >

  <small
    id="imageInfo"
    style="
      color:#666;
      font-size:.8rem;
    ">

    You can upload up to 4 images

  </small>

  <!-- IMAGE PREVIEW -->

  <div
    id="previewContainer"
    style="
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:10px;
    ">

  </div>

</div>


      <button class="btn" type="submit">
        Select Technician
      </button>

    </form>

  </div>

  <script src="js/pages/repair-request.js"></script>

</body>
</html>
