<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechRider - Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/notifications-customer.css">
<script src="js/api.js" data-require-role="customer"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div class="header-left">

      <h2>
        Notifications
      </h2>

      <p>
        Stay updated with your TechRider activities
      </p>

    </div>

    <a
      href="dashboard-customer.html"
      class="back-btn"
    >
      <i class="fas fa-arrow-left"></i>
      Back
    </a>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <!-- FILTERS -->
    <div class="filter-group">

      <button
        class="filter-btn active"
        data-filter="all"
      >
        All
      </button>

      <button
        class="filter-btn"
        data-filter="read"
      >
        Read
      </button>

      <button
        class="filter-btn"
        data-filter="unread"
      >
        Unread
      </button>

    </div>

    <!-- MARK ALL -->
    <div class="mark-all">

      <input
        type="checkbox"
        id="markAllCheckbox"
      >

      <label for="markAllCheckbox">
        Mark all as read
      </label>

    </div>

  </div>

  <!-- NOTIFICATIONS -->
  <div
    class="notifications-container"
    id="notificationsContainer"
  ><div class="tr-skeleton-list" aria-busy="true" aria-label="Loading"><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div></div>

  </div>

</div>

<script src="js/pages/notifications-customer.js"></script>

</body>
</html>
