<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Customer Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --gray:#f6f6f6;
    }

    body{
      background:var(--gray);
      min-height:100vh;
      display:flex;
    }

    /* OVERLAY (MOBILE) */
    .overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      display:none;
      z-index:999;
    }

    .overlay.show{
      display:block;
    }

    /* SIDEBAR */
    .sidebar{
      width:260px;
      background:linear-gradient(180deg,var(--purple),var(--deep-purple));
      color:white;
      padding:20px;
      position:fixed;
      height:100vh;
      left:0;
      top:0;
      transition:0.3s;
      z-index:1000;
    }

    .sidebar.collapsed{
      width:70px;
      padding:20px 10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius:10px;
      background:var(--lilac);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--deep-purple);
      font-weight:bold;
      flex-shrink:0;
    }

    .nav{
      margin-top:20px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .nav a{
      color:white;
      text-decoration:none;
      padding:10px;
      border-radius:10px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .sidebar.collapsed .text{
      display:none;
    }

    /* MAIN */
    .main{
      margin-left:260px;
      width:calc(100% - 260px);
      padding:20px;
      transition:0.3s;
    }

    /* TOPBAR */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:white;
      padding:15px;
      border-radius:12px;
    }

    .hamburger{
      display:none;
      font-size:1.3rem;
      cursor:pointer;
    }

    .user{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .avatar{
      width:40px;
      height:40px;
      border-radius:50%;
      background:var(--purple);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }

    /* CARDS */
    .cards{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      margin-top:20px;
    }
    .badge{
      background:red;
      color:white;
      font-size:0.7rem;
      padding:2px 6px;
      border-radius:50%;
      margin-left:auto;
}
    .card{
      background:white;
      padding:25px;
      border-radius:14px;
    }

    .action{
      margin-top:20px;
      background:linear-gradient(135deg,var(--purple),#c77dff);
      color:white;
      padding:30px;
      border-radius:16px;
      cursor:pointer;
    }

    /* MOBILE RESPONSIVE FIX */
    @media(max-width:768px){

      .sidebar{
        transform:translateX(-100%);
        width:260px !important;
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .main{
        margin-left:0;
        width:100%;
      }

      .hamburger{
        display:block;
      }

      .cards{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <div class="sidebar collapsed" id="sidebar">

    <div class="brand" id="brand">
      <div class="logo" id="logo">U</div>
      <span class="text">User</span>
    </div>
<div class="nav">
  <a href="repair-request.html">
    <i class="fas fa-tools"></i>
    <span class="text">Repair Request</span>
  </a>

  <a href="history-customer.html">
    <i class="fas fa-clock"></i>
    <span class="text">History</span>
  </a>

  <a href="notifications-customer.html">
    <i class="fas fa-bell"></i>
    <span class="text">Notifications</span>
    <span class="badge">2</span>
  </a>

  <a href="profile-customer.html">
    <i class="fas fa-user"></i>
    <span class="text">Profile</span>
  </a>

  <a href="login-customer.html">
    <i class="fas fa-sign-out-alt"></i>
    <span class="text">Logout</span>
  </a>
</div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">

      <div class="hamburger" id="hamburger">
        <i class="fas fa-bars"></i>
      </div>

      <div class="user">
        <a href="profile-customer.html" class="avatar" id="avatar">U</a>
        <span>Welcome, User</span>
      </div>

    </div>

    <div class="cards">
      <div class="card">
        <h3>Active Requests</h3>
        <p>0 ongoing services</p>
      </div>

      <div class="card">
        <h3>Completed</h3>
        <p>0 services completed</p>
      </div>
    </div>

    <div class="action" onclick="location.href='repair-request.html'">
      <h3>Request Repair</h3>
      <p>Get technical help instantly</p>
    </div>

  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const hamburger = document.getElementById('hamburger');

    function openSidebar(){
      sidebar.classList.add('open');
      overlay.classList.add('show');
    }

    function closeSidebar(){
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }

    hamburger.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);

    // desktop toggle
    document.getElementById('brand').addEventListener('click', ()=>{
      sidebar.classList.toggle('collapsed');
    });

  </script>

</body>
</html>
