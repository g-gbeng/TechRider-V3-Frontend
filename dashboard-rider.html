<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>TechRider Rider Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
}

/* BODY */
body{
background:var(--gray);
min-height:100vh;
display:flex;
animation:fadeIn .5s ease-in;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:linear-gradient(
180deg,
var(--purple),
var(--deep-purple)
);
color:white;
padding:20px;
position:fixed;
height:100vh;
transition:.3s;
}

.sidebar.collapsed{
width:70px;
}

.brand{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}

.logo{
width:40px;
height:40px;
border-radius:10px;
background:var(--lilac);
display:flex;
align-items:center;
justify-content:center;
color:var(--deep-purple);
font-weight:bold;
}

.nav{
margin-top:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.nav a{
color:white;
text-decoration:none;
padding:10px;
border-radius:10px;
display:flex;
gap:10px;
align-items:center;
}

.nav a:hover{
background:rgba(255,255,255,.08);
}

.sidebar.collapsed .text{
display:none;
}

/* MAIN */
.main{
margin-left:260px;
width:calc(100% - 260px);
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:15px;
border-radius:12px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:var(--purple);
color:white;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:25px;
border-radius:14px;
}

.action{
margin-top:20px;
background:linear-gradient(
135deg,
var(--purple),
#c77dff
);
color:white;
padding:30px;
border-radius:16px;
cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
.cards{
grid-template-columns:1fr;
}
}

@media(max-width:768px){

.sidebar{
transform:translateX(-100%);
}

.sidebar.open{
transform:translateX(0);
}

.main{
margin-left:0;
width:100%;
}

}

/* FADE */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar collapsed"
id="sidebar">

<div class="brand"
onclick="toggleSidebar()">

<div class="logo">
R
</div>

<span class="text">
Rider
</span>

</div>

<div class="nav">

<a href="available-jobs-rider.html">
<i class="fas fa-box"></i>
<span class="text">
Available Requests
</span>
</a>

<a href="active-jobs-rider.html">
<i class="fas fa-truck"></i>
<span class="text">
Active Deliveries
</span>
</a>

<a href="history-rider.html">
<i class="fas fa-history"></i>
<span class="text">
Delivery History
</span>
</a>

<a href="notifications-rider.html">
<i class="fas fa-bell"></i>
<span class="text">
Notifications
</span>
</a>

<a href="profile-rider.html">
<i class="fas fa-user"></i>
<span class="text">
Profile
</span>
</a>

<a href="login-rider.html">
<i class="fas fa-sign-out-alt"></i>
<span class="text">
Logout
</span>
</a>

</div>

</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">

<h3>
Welcome, Rider
</h3>

<a href="profile-rider.html"
class="avatar">
R
</a>

</div>

<div class="cards">

<div class="card">
<h3>
Available Requests
</h3>
<p>
0 jobs available
</p>
</div>

<div class="card">
<h3>
Active Deliveries
</h3>
<p>
0 deliveries ongoing
</p>
</div>

<div class="card">
<h3>
Total Earnings
</h3>
<p>
₦0.00
</p>
</div>

</div>

<div
class="action"
onclick="
location.href=
'available-jobs-rider.html'
">

<h3>
View Available Requests
</h3>

<p>
Accept new delivery jobs
</p>

</div>

</div>

<script>
function toggleSidebar(){
document
.getElementById('sidebar')
.classList
.toggle('collapsed');
}
</script>

</body>
</html>
