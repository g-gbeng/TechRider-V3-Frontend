<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Rider Notifications - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
}

body{
background:var(--gray);
padding:20px;
animation:fadeIn .5s ease-in;
}

.wrapper{
max-width:900px;
margin:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;
}

.back-btn{
text-decoration:none;
background:white;
padding:12px 18px;
border-radius:12px;
color:var(--purple);
font-weight:600;
}

h2{
color:var(--deep-purple);
}

.notice{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 5px 18px rgba(0,0,0,.05);
border-left:5px solid var(--purple);
}

.notice.unread{
background:#fcf8ff;
}

.notice-head{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:12px;
}

.tag{
padding:8px 14px;
border-radius:20px;
font-size:.75rem;
font-weight:600;
background:#f3e8ff;
color:var(--purple);
}

.badge{
background:var(--purple);
color:white;
padding:5px 10px;
border-radius:20px;
font-size:.7rem;
}

.notice p{
color:#444;
margin-bottom:10px;
line-height:1.5;
}

.time{
font-size:.85rem;
color:#777;
margin-bottom:15px;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.read-btn{
background:linear-gradient(
135deg,
var(--purple),
var(--lilac)
);
color:white;
}

.remove-btn{
background:#eee;
}

.empty{
display:none;
text-align:center;
background:white;
padding:40px;
border-radius:18px;
}

@media(max-width:768px){

.actions{
flex-direction:column;
}

button{
width:100%;
}

}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>
<body>

<div class="wrapper">

<div class="topbar">

<a href="dashboard-rider.html"
class="back-btn">
← Back to Dashboard
</a>

<h2>Notifications</h2>

</div>


<div id="notificationContainer"></div>

<div
id="emptyState"
class="empty">
No notifications.
</div>

</div>


<script>

/* DUMMY FRONTEND DATA */

let notifications = [

{
type:"New Job Available",
message:
"A new pickup request has been assigned and is available in Available Jobs.",
time:"5 mins ago",
read:false
},

{
type:"Delivery Updated",
message:
"Customer updated delivery address for an active job. The new address is 14D Jay Momoh street, Ajao Estate",
time:"30 mins ago",
read:false
},

{
type:"Job Cancelled",
message:
"A previously assigned pickup request was cancelled by customer.",
time:"1 hour ago",
read:true
},

{
type:"Admin Notice",
message:
"Ensure deliveries are confirmed before marking completed.",
time:"Today",
read:true
}

];

function renderNotifications(){

let container=
document.getElementById(
"notificationContainer"
);

container.innerHTML="";

/* newest first */
notifications.forEach(
(notice,index)=>{

container.innerHTML+=`

<div class="notice
${!notice.read ? 'unread':''}
">

<div class="notice-head">

<div class="tag">
${notice.type}
</div>

${
!notice.read
? '<div class="badge">Unread</div>'
: ''
}

</div>

<p>
${notice.message}
</p>

<div class="time">
${notice.time}
</div>

<div class="actions">

${
!notice.read
?
`<button
class="read-btn"
onclick="markRead(${index})">
Mark as Read
</button>`
:''
}

<button
class="remove-btn"
onclick="removeNotice(${index})">
Remove
</button>

</div>

</div>

`;

});

if(notifications.length===0){

document
.getElementById(
"emptyState"
)
.style.display="block";

}else{

document
.getElementById(
"emptyState"
)
.style.display="none";

}

}

function markRead(index){

notifications[index].read=true;

renderNotifications();

}

function removeNotice(index){

notifications.splice(index,1);

renderNotifications();

}

renderNotifications();

</script>

</body>
</html>
