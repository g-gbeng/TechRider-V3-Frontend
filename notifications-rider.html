<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Rider Notifications - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/notifications-rider.css">
<script src="js/api.js" data-require-role="rider"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="wrapper">

<!-- TOP -->

<div class="topbar">

<a href="dashboard-rider.html"
class="back-btn">
← Back to Dashboard
</a>

<div class="page-title">
<i class="fas fa-bell"
style="color:var(--purple);font-size:1.4rem;"></i>

<h2>Notifications</h2>
</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<div class="filters">

<button
class="filter-btn active"
onclick="filterNotifications('all',this)">
All
</button>

<button
class="filter-btn"
onclick="filterNotifications('unread',this)">
Unread
</button>

<button
class="filter-btn"
onclick="filterNotifications('read',this)">
Read
</button>

</div>

<label class="mark-all">

<input
type="checkbox"
id="markAllCheckbox"
onclick="markAllAsRead()">

<span>Mark all as read</span>

</label>

</div>

<!-- NOTIFICATIONS -->

<div id="notificationContainer"><div class="tr-skeleton-list" aria-busy="true" aria-label="Loading"><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div></div></div>

<!-- EMPTY -->

<div
id="emptyState"
class="empty">

<i class="fas fa-bell-slash"></i>

<h3>No Notifications</h3>

<p>
You currently have no notifications.
</p>

</div>

</div>

<script src="js/pages/notifications-rider.js"></script>

</body>
</html>
