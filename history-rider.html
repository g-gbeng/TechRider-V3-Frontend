<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>

<title>Rider Delivery History</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/history-rider.css">
<script src="js/api.js" data-require-role="rider"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="wrapper">

<!-- TOPBAR -->

<div class="topbar">

<a href="dashboard-rider.html"
class="back-btn">

← Back to Dashboard

</a>

<h2>
Delivery History
</h2>

</div>

<!-- FILTERS -->

<div class="controls">

<input
type="text"
id="searchInput"
placeholder="Search name or job code"
onkeyup="renderHistory()">

<select
id="sortSelect"
onchange="renderHistory()">

<option value="recent">
Most Recent
</option>

<option value="oldest">
Oldest First
</option>

</select>

</div>

<!-- HISTORY CONTAINER -->

<div id="historyContainer"><div class="tr-skeleton-list" aria-busy="true" aria-label="Loading"><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div><div class="tr-skeleton-card"><span class="tr-skel"></span><span class="tr-skel w80"></span><span class="tr-skel w60"></span></div></div></div>

<!-- EMPTY STATE -->

<div
id="emptyState"
class="empty">

No finished deliveries yet.

</div>

</div>

<script src="js/pages/history-rider.js"></script>

</body>
</html>
