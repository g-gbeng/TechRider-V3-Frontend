<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    TechRider - Active Repairs
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --gray:#f6f6f6;
      --white:#fff;
      --green:#16a34a;
      --red:#dc2626;
      --gray-badge:#9ca3af;
      --blue:#2563eb;
    }

    body{
      background:var(--gray);
      padding:20px;
      display:flex;
      justify-content:center;
      animation:fadeIn .6s ease;
      min-height:100vh;
    }

    .container{
      width:100%;
      max-width:1100px;
    }

    /* HEADER */

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      flex-wrap:wrap;
      gap:15px;
    }

    .header-left{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .header h2{
      color:var(--deep-purple);
    }

    .header p{
      color:#666;
      font-size:.9rem;
    }

    .back-btn{
      text-decoration:none;
      background:var(--purple);
      color:white;
      padding:11px 15px;
      border-radius:10px;
      font-size:.88rem;
      font-weight:600;
      transition:.3s;
    }

    .back-btn:hover{
      opacity:.92;
    }

    /* GRID */

    .repairs-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:18px;
    }

    /* CARD */

    .repair-card{
      background:var(--white);
      padding:22px;
      border-radius:18px;
      box-shadow:0 10px 25px rgba(0,0,0,.05);
      transition:.3s;
      animation:fadeIn .4s ease;
    }

    .repair-card:hover{
      transform:translateY(-3px);
    }

    /* TOP */

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:15px;
    }

    .title{
      font-size:1rem;
      font-weight:600;
      color:var(--deep-purple);
      line-height:1.5;
    }

    .request-id{
      margin-top:8px;
      display:inline-block;
      background:#f3e8ff;
      color:var(--purple);
      padding:6px 12px;
      border-radius:20px;
      font-size:.75rem;
      font-weight:600;
    }

    /* STATUS */

    .status{
      padding:8px 14px;
      border-radius:30px;
      font-size:.8rem;
      font-weight:600;
      white-space:nowrap;
      text-transform:capitalize;
      color:white;
    }

    .status.pending{
      background:var(--gray-badge);
    }

    .status.in-progress{
      background:var(--blue);
    }

    .status.cancelled{
      background:var(--red);
    }

    /* DETAILS */

    .details{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:15px;
      font-size:.88rem;
      color:#444;
    }

    .details div{
      line-height:1.5;
    }

    .details i{
      width:18px;
      margin-right:6px;
      color:var(--purple);
    }

    /* DESCRIPTION */

    .desc{
      margin-top:15px;
      padding:14px;
      background:#fafafa;
      border-left:4px solid var(--purple);
      border-radius:10px;
      font-size:.88rem;
      line-height:1.7;
      color:#333;
    }

    /* QUOTATION */

    

    /* STATUS INFO */

    .status-info{
      margin-top:15px;
      padding:13px;
      border-radius:10px;
      font-size:.85rem;
      line-height:1.6;
    }

    .status-info.pending{
      background:#f3f4f6;
      color:#4b5563;
    }

    .status-info.in-progress{
      background:#eff6ff;
      color:#1d4ed8;
    }

    .status-info.cancelled{
      background:#fef2f2;
      color:#b91c1c;
    }

    /* TIMESTAMP */

    .timestamp{
      margin-top:15px;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:.82rem;
      color:#777;
      flex-wrap:wrap;
    }

    /* EMPTY STATE */

    .empty{
      background:white;
      border-radius:18px;
      padding:55px 20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.05);
      display:none;
      animation:fadeIn .5s ease;
    }

    .empty i{
      font-size:3rem;
      margin-bottom:14px;
      color:var(--purple);
    }

    .empty h3{
      color:var(--deep-purple);
      margin-bottom:8px;
    }

    .empty p{
      color:#666;
      font-size:.9rem;
      line-height:1.6;
    }

    /* MOBILE */

    @media(max-width:768px){

      body{
        padding:15px;
      }

      .repairs-grid{
        grid-template-columns:1fr;
      }

      .top{
        flex-direction:column;
        align-items:flex-start;
      }

      .status{
        align-self:flex-start;
      }

      .back-btn{
        width:100%;
        text-align:center;
      }

    }

    /* ANIMATION */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="header-left">

        <h2>
          Active Repairs
        </h2>

        <p>
          Track your current repair requests in real time
        </p>

      </div>

      <a
        href="dashboard-customer.html"
        class="back-btn"
      >

        <i class="fas fa-arrow-left"></i>
        Back

      </a>

    </div>

    <!-- REPAIRS GRID -->

    <div
      class="repairs-grid"
      id="repairsGrid"
    >

    </div>

    <!-- EMPTY STATE -->

    <div
      class="empty"
      id="emptyState"
    >

      <i class="fas fa-tools"></i>

      <h3>
        No Active Repairs
      </h3>

      <p>
        Your pending or in-progress
        repair requests will appear here.
      </p>

    </div>

  </div>

  <script>

    /* =========================================
    CURRENT CUSTOMER
    ========================================= */

    const currentCustomer =
      JSON.parse(
        localStorage.getItem(
          'techrider_current_customer'
        )
      );

    /* =========================================
    SECURITY CHECK
    ========================================= */

    if(!currentCustomer){

      window.location.href =
        'login-customer.html';

    }

    /* =========================================
    ELEMENTS
    ========================================= */

    const repairsGrid =
      document.getElementById(
        'repairsGrid'
      );

    const emptyState =
      document.getElementById(
        'emptyState'
      );

    /* =========================================
    FORMAT DATE
    ========================================= */

    function formatDate(dateString){

      if(!dateString){
        return 'Recently';
      }

      const date =
        new Date(dateString);

      return date.toLocaleString(
        'en-NG',
        {
          day:'numeric',
          month:'short',
          year:'numeric',
          hour:'numeric',
          minute:'2-digit'
        }
      );

    }

    /* =========================================
    GET STATUS CLASS
    ========================================= */

    function getStatusClass(status){

      switch(
        (status || '')
        .toLowerCase()
      ){

        case 'in progress':
          return 'in-progress';

        case 'cancelled':
          return 'cancelled';

        default:
          return 'pending';

      }

    }

    /* =========================================
    GET STATUS LABEL
    ========================================= */

    function getStatusLabel(status){

      switch(
        (status || '')
        .toLowerCase()
      ){

        case 'in progress':
          return 'In Progress';

        case 'cancelled':
          return 'Cancelled';

        default:
          return 'Pending';

      }

    }

    /* =========================================
    GET STATUS MESSAGE
    ========================================= */

    function getStatusMessage(status){

      switch(
        (status || '')
        .toLowerCase()
      ){

        case 'in progress':

          return `
          Your repair is currently
          being worked on by the technician.
          `;

        case 'cancelled':

          return `
          This repair request was cancelled
          by the admin.
          `;

        default:

          return `
          Waiting for technician confirmation
          and device delivery.
          `;

      }

    }

    /* =========================================
    GET ACTIVE REPAIRS
    ========================================= */

    function getActiveRepairs(){

      let requests =
        JSON.parse(
          localStorage.getItem(
            'techrider_requests'
          )
        ) || [];

      /* FILTER CURRENT CUSTOMER */

      requests =
        requests.filter(request => {

          return (
            request.customerId ===
            currentCustomer.id
          );

        });

      /* REMOVE COMPLETED JOBS */

      requests =
        requests.filter(request => {

          return (
            (request.status || '')
            .toLowerCase() !==
            'completed'
          );

        });

      /* SORT LATEST FIRST */

      requests.sort(
        (a,b) =>

          new Date(
            b.createdAt
          ) -

          new Date(
            a.createdAt
          )

      );

      return requests;

    }

    /* =========================================
    RENDER ACTIVE REPAIRS
    ========================================= */

    function renderRepairs(){

      const repairs =
        getActiveRepairs();

      repairsGrid.innerHTML = '';

      /* EMPTY STATE */

      if(repairs.length === 0){

        emptyState.style.display =
          'block';

        return;

      }

      emptyState.style.display =
        'none';

      /* CREATE CARDS */

      repairs.forEach(repair => {

        const currentStatus =
          repair.status || 'pending';

        repairsGrid.innerHTML += `

          <div class="repair-card">

            <div class="top">

              <div>

                <div class="title">

                  ${repair.brand || ''}
                  ${repair.model || ''}

                  ${repair.deviceType
                    ? `(${repair.deviceType})`
                    : ''
                  }

                </div>

                <div class="request-id">

                  ${repair.requestId || repair.id}

                </div>

              </div>

              <div class="status
              ${getStatusClass(currentStatus)}">

                ${getStatusLabel(currentStatus)}

              </div>

            </div>

            <div class="details">

              <div>
                <i class="fas fa-mobile-alt"></i>

                <strong>Device Type:</strong>

                ${repair.deviceType || 'N/A'}
              </div>

              <div>
                <i class="fas fa-tag"></i>

                <strong>Brand:</strong>

                ${repair.brand || 'N/A'}
              </div>

              <div>
                <i class="fas fa-microchip"></i>

                <strong>Model:</strong>

                ${repair.model || 'N/A'}
              </div>

              <div>
                <i class="fas fa-map-marker-alt"></i>

                <strong>Location:</strong>

                ${repair.location || 'N/A'}
              </div>

              <div>
                <i class="fas fa-user-cog"></i>

                <strong>Technician:</strong>

                ${repair.technicianName || 'Awaiting Assignment'}
              </div>

            </div>

            <div class="desc">

              <strong>
                Issue Description:
              </strong>

              <br><br>

              ${repair.description || 'No description provided.'}

            </div>

            ${
              repair.repairPrice

              ? `


              `

              : ''

            }

            <div class="status-info
            ${getStatusClass(currentStatus)}">

              ${getStatusMessage(currentStatus)}

            </div>

            <div class="timestamp">

              <i class="fas fa-clock"></i>

              Requested:
              ${formatDate(repair.createdAt)}

            </div>

          </div>

        `;

      });

    }

    /* =========================================
    LIVE STORAGE SYNC
    ========================================= */

    window.addEventListener(
      'storage',
      renderRepairs
    );

    

    /* =========================================
    INITIAL RENDER
    ========================================= */

    renderRepairs();

  </script>

</body>
</html>
