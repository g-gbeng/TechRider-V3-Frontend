<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    TechRider - Active Repairs
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/active-repairs-customer.css">
  <script src="js/api.js" data-require-role="customer"></script>

</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="header-left">

        <h2>
          Active Repairs
        </h2>

        <p>
          Track your current repair requests in real time
        </p>

      </div>

      <a
        href="dashboard-customer.html"
        class="back-btn"
      >

        <i class="fas fa-arrow-left"></i>
        Back

      </a>

    </div>

    <!-- REPAIRS GRID -->

    <div
      class="repairs-grid"
      id="repairsGrid"
    >

    </div>

    <!-- EMPTY STATE -->

    <div
      class="empty"
      id="emptyState"
    >

      <i class="fas fa-tools"></i>

      <h3>
        No Active Repairs
      </h3>

      <p>
        Your pending or in-progress
        repair requests will appear here.
      </p>

    </div>

  </div>

  <script src="js/pages/active-repairs-customer.js"></script>

</body>
</html>
