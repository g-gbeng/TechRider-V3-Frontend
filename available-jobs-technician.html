<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>
Technician Available Jobs - TechRider
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/available-jobs-technician.css">
<script src="js/api.js" data-require-role="technician"></script>
</head>

<body>

<div class="container">

<div class="header">

<h2>
Available Repair Jobs
</h2>

<a
href="dashboard-technician.html"
class="back">

← Dashboard

</a>

</div>

<div
class="grid"
id="jobsGrid">
</div>

<div
class="empty"
id="emptyState">

No repair jobs available at the moment.

</div>

</div>

<!-- PRICE MODAL -->

<div
class="overlay"
id="priceModal">

<div class="modal">

<h3>
Send Repair Quotation
</h3>

<p id="modalText">
Enter your repair quotation for this request.
</p>

<div class="input-group">

<label>
Repair Price (₦)
</label>

<input
type="number"
id="repairPrice"
placeholder="Enter amount">

</div>

<div class="modal-actions">

<button
class="cancel-btn"
onclick="closeModal()">

Cancel

</button>

<button
class="send-btn"
onclick="sendQuotation()">

Send Quote

</button>

</div>

</div>

</div>

<script src="js/pages/available-jobs-technician.js"></script>

</body>
</html>
