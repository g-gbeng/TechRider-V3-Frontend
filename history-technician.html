<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>
Technician Job History - TechRider
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
--white:#fff;
--green:#16a34a;
--red:#dc2626;
}

body{
background:var(--gray);
padding:20px;
animation:fadeIn .5s ease-in;
}

.container{
max-width:1100px;
margin:auto;
}

/* HEADER */

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
margin-bottom:25px;
gap:12px;
}

.header h2{
color:var(--deep-purple);
}

.back{
text-decoration:none;
background:var(--purple);
color:white;
padding:11px 15px;
border-radius:10px;
font-size:.9rem;
font-weight:600;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

/* CARD */

.card{
background:var(--white);
padding:22px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:15px;
}

.title{
font-weight:600;
font-size:1rem;
line-height:1.5;
color:var(--deep-purple);
}

/* STATUS */

.status{
font-size:.75rem;
padding:7px 12px;
border-radius:20px;
color:white;
font-weight:600;
white-space:nowrap;
}

.status.completed{
background:var(--green);
}

.status.cancelled{
background:var(--red);
}

/* REQUEST ID */

.request-id{
margin-top:8px;
display:inline-block;
background:#f3e8ff;
color:var(--purple);
padding:6px 12px;
border-radius:20px;
font-size:.75rem;
font-weight:600;
}

/* DETAILS */

.details{
margin-top:15px;
display:flex;
flex-direction:column;
gap:10px;
font-size:.88rem;
color:#444;
}

.details div{
line-height:1.5;
}

.details i{
color:var(--purple);
width:18px;
margin-right:6px;
}

/* DESCRIPTION */

.desc{
margin-top:15px;
padding:14px;
background:#fafafa;
border-left:4px solid var(--purple);
border-radius:10px;
font-size:.88rem;
line-height:1.7;
color:#333;
}

/* PRICE */

.price-box{
margin-top:15px;
background:#f8f5ff;
padding:14px;
border-radius:12px;
font-size:.9rem;
font-weight:600;
color:var(--deep-purple);
}

/* FOOTER */

.footer{
margin-top:15px;
font-size:.82rem;
color:#777;
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

/* EMPTY STATE */

.empty{
background:white;
padding:50px 20px;
border-radius:18px;
text-align:center;
color:#666;
display:none;
}

.empty i{
font-size:2.5rem;
margin-bottom:12px;
color:var(--purple);
}

/* MOBILE */

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

}

/* ANIMATION */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h2>
Job History
</h2>

<a
href="dashboard-technician.html"
class="back">

← Dashboard

</a>

</div>

<div
class="grid"
id="historyGrid">
</div>

<div
class="empty"
id="emptyState">

<i class="fas fa-box-open"></i>

<p>
No completed or cancelled jobs yet
</p>

</div>

</div>

<script>

/* =========================================
CURRENT TECHNICIAN
========================================= */

const currentTechnician =
JSON.parse(
localStorage.getItem(
'techrider_current_technician'
)
);

/* =========================================
REDIRECT IF NOT LOGGED IN
========================================= */

if(!currentTechnician){

alert(
'Please login as technician'
);

window.location.href =
'login-technician.html';

}

/* =========================================
ELEMENTS
========================================= */

const historyGrid =
document.getElementById(
'historyGrid'
);

const emptyState =
document.getElementById(
'emptyState'
);

/* =========================================
FORMAT DATE
========================================= */

function formatDate(dateString){

if(!dateString){
return 'Recently';
}

const date =
new Date(dateString);

return date.toLocaleString(
'en-NG',
{
day:'numeric',
month:'short',
year:'numeric',
hour:'numeric',
minute:'2-digit'
}
);

}

/* =========================================
GET HISTORY JOBS
========================================= */

function getHistoryJobs(){

const technicianId =
currentTechnician.id
|| currentTechnician.technicianId;

let historyJobs =
JSON.parse(
localStorage.getItem(
'tech_job_history'
)
) || [];

/* FILTER CURRENT TECHNICIAN */

historyJobs =
historyJobs.filter(job => {

return (
job.technicianId === technicianId
||
job.assignedTechnician === technicianId
);

});

return historyJobs;

}

/* =========================================
GET STATUS CLASS
========================================= */

function getStatusClass(status){

if(
(status || '').toLowerCase() ===
'cancelled'
){
return 'cancelled';
}

return 'completed';

}

/* =========================================
GET STATUS LABEL
========================================= */

function getStatusLabel(status){

if(
(status || '').toLowerCase() ===
'cancelled'
){
return 'Cancelled';
}

return 'Completed';

}

/* =========================================
RENDER HISTORY
========================================= */

function renderHistory(){

const historyJobs =
getHistoryJobs();

historyGrid.innerHTML = '';

if(historyJobs.length === 0){

emptyState.style.display =
'block';

return;

}

emptyState.style.display =
'none';

historyJobs
.sort((a,b)=>
new Date(
b.completedAt ||
b.cancelledAt ||
b.updatedAt ||
b.createdAt
)
-
new Date(
a.completedAt ||
a.cancelledAt ||
a.updatedAt ||
a.createdAt
)
)
.forEach(job => {

const currentStatus =
job.jobStatus ||
job.status ||
'Completed';

historyGrid.innerHTML += `

<div class="card">

<div class="top">

<div>

<div class="title">

${job.brand || ''}
${job.model || ''}
${job.deviceType
? `(${job.deviceType})`
: ''}

</div>

<div class="request-id">

${job.requestId || 'REQ'}

</div>

</div>

<div class="status
${getStatusClass(currentStatus)}">

${getStatusLabel(currentStatus)}

</div>

</div>

<div class="details">

<div>
<i class="fas fa-mobile-alt"></i>

<strong>Device Type:</strong>

${job.deviceType || 'N/A'}

</div>

<div>
<i class="fas fa-tag"></i>

<strong>Brand:</strong>

${job.brand || 'N/A'}

</div>

<div>
<i class="fas fa-microchip"></i>

<strong>Model:</strong>

${job.model || 'N/A'}

</div>

</div>

<div class="desc">

<strong>Issue Description:</strong>

<br><br>

${job.description || 'No description provided.'}

</div>

<div class="price-box">

Repair Quotation:
₦${Number(
job.repairPrice || 0
).toLocaleString()}

</div>

<div class="footer">

<i class="fas
${getStatusClass(currentStatus) === 'cancelled'
? 'fa-times-circle'
: 'fa-check-circle'
}"></i>

${getStatusClass(currentStatus) === 'cancelled'
? 'Cancelled'
: 'Completed'
}:

${formatDate(
job.completedAt ||
job.cancelledAt ||
job.updatedAt ||
job.createdAt
)}

</div>

</div>

`;

});

}

/* =========================================
LIVE STORAGE SYNC
========================================= */

window.addEventListener(
'storage',
renderHistory
);

/* =========================================
AUTO REFRESH
========================================= */

setInterval(
renderHistory,
7000
);

/* =========================================
INITIAL RENDER
========================================= */

renderHistory();

</script>

</body>
</html>
