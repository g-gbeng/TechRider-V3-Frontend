<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Technician Notifications - TechRider
</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{
  --purple:#5a189a;
  --deep-purple:#240046;
  --lilac:#e0aaff;
  --gray:#f6f6f6;
  --white:#fff;
}

body{
  background:var(--gray);
  padding:20px;
  animation:fadeIn .45s ease;
  min-height:100vh;
}

.container{
  max-width:950px;
  margin:auto;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  gap:15px;
  flex-wrap:wrap;
}

.headerLeft h2{
  color:var(--deep-purple);
}

.headerLeft p{
  color:#666;
  margin-top:4px;
  font-size:.9rem;
}

.back{
  text-decoration:none;
  background:var(--purple);
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:.88rem;
  transition:.3s;
}

.back:hover{
  opacity:.92;
}

/* CONTROLS */

.controls{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filterBtn{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  background:#eee;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

.filterBtn.active{
  background:var(--purple);
  color:white;
}

.actions{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.markAll{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.9rem;
  color:#555;
}

.markAll input{
  width:18px;
  height:18px;
  accent-color:var(--purple);
}

/* LIST */

.list{
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* CARD */

.card{
  background:var(--white);
  padding:18px;
  border-radius:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
  display:flex;
  gap:15px;
  align-items:flex-start;
  transition:.25s;
  animation:fadeIn .4s ease;
}

.card:hover{
  transform:translateY(-2px);
}

.unread{
  border-left:5px solid var(--purple);
  background:#faf7ff;
}

/* ICON */

.icon{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  flex-shrink:0;
  font-size:1rem;
}

.job{
  background:var(--purple);
}

.admin{
  background:#2563eb;
}

.alert{
  background:#f59e0b;
}

.general{
  background:#6b7280;
}

/* CONTENT */

.content{
  flex:1;
  min-width:0;
}

.topRow{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.title{
  font-weight:700;
  font-size:1rem;
  color:var(--deep-purple);
}

.message{
  font-size:.9rem;
  color:#555;
  margin-top:7px;
  line-height:1.7;
}

.time{
  font-size:.78rem;
  color:#999;
  margin-top:10px;
}

/* BUTTONS */

.cardActions{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.readBtn{
  border:none;
  background:var(--purple);
  color:white;
  padding:9px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:.82rem;
  font-weight:600;
}

.readBadge{
  background:#dcfce7;
  color:#166534;
  padding:8px 12px;
  border-radius:30px;
  font-size:.75rem;
  font-weight:700;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:20px;
  padding:60px 20px;
  text-align:center;
  display:none;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}

.empty i{
  font-size:3rem;
  color:var(--purple);
  margin-bottom:15px;
}

.empty h3{
  color:var(--deep-purple);
  margin-bottom:8px;
}

.empty p{
  color:#666;
}

/* MOBILE */

@media(max-width:768px){

  body{
    padding:15px;
  }

  .controls{
    align-items:flex-start;
  }

  .actions{
    width:100%;
    justify-content:space-between;
  }

  .card{
    flex-direction:column;
  }

  .topRow{
    flex-direction:column;
  }

  .back{
    width:100%;
    text-align:center;
  }

}

/* ANIMATION */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div class="headerLeft">

      <h2>
        Notifications
      </h2>

      <p>
        View updates, alerts and admin messages
      </p>

    </div>

    <a
      href="dashboard-technician.html"
      class="back"
    >
      <i class="fas fa-arrow-left"></i>
      Dashboard
    </a>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="filters">

      <button
        class="filterBtn active"
        onclick="setFilter('all', this)"
      >
        All
      </button>

      <button
        class="filterBtn"
        onclick="setFilter('unread', this)"
      >
        Unread
      </button>

      <button
        class="filterBtn"
        onclick="setFilter('read', this)"
      >
        Read
      </button>

    </div>

    <div class="actions">

      <label class="markAll">

        <input
          type="checkbox"
          id="markAllCheckbox"
          onchange="markAllAsRead()"
        >

        Mark all as read

      </label>

    </div>

  </div>

  <!-- LIST -->
  <div
    class="list"
    id="notificationList"
  ></div>

  <!-- EMPTY -->
  <div
    class="empty"
    id="emptyState"
  >

    <i class="fas fa-bell-slash"></i>

    <h3>
      No Notifications
    </h3>

    <p>
      Notifications from admin will appear here.
    </p>

  </div>

</div>

<script>

/* =========================
   CURRENT TECHNICIAN
========================= */

const currentTechnician =
  JSON.parse(
    localStorage.getItem(
      "techrider_current_technician"
    )
  );

/* SECURITY */

if(!currentTechnician){

  window.location.href =
    "login-technician.html";

}

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
  "techrider_notifications";

/* =========================
   FILTER STATE
========================= */

let currentFilter = "all";

/* =========================
   GET NOTIFICATIONS
========================= */

function getNotifications(){

  const allNotifications =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  return allNotifications
    .filter(notification =>

      notification.userType ===
      "technician"

      &&

      (
        notification.userId === currentTechnician.id
        ||
        notification.targetId === currentTechnician.id
        ||
        notification.recipientId === currentTechnician.id
      )

    )
    .sort(
      (a,b) =>

        new Date(
          b.createdAt || 0
        ) -

        new Date(
          a.createdAt || 0
        )

    );

}

/* =========================
   FORMAT TIME
========================= */

function formatTime(date){

  if(!date) return "Recently";

  return new Date(date)
    .toLocaleString(
      "en-NG",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

}

/* =========================
   ICON TYPE
========================= */

function getTypeClass(type){

  switch(type){

    case "job":
      return "job";

    case "admin":
      return "admin";

    case "alert":
      return "alert";

    default:
      return "general";

  }

}

function getTypeIcon(type){

  switch(type){

    case "job":
      return "fa-tools";

    case "admin":
      return "fa-user-shield";

    case "alert":
      return "fa-exclamation-triangle";

    default:
      return "fa-bell";

  }

}

/* =========================
   FILTER
========================= */

function setFilter(type, button){

  currentFilter = type;

  document
    .querySelectorAll(".filterBtn")
    .forEach(btn =>

      btn.classList.remove(
        "active"
      )

    );

  button.classList.add(
    "active"
  );

  renderNotifications();

}

/* =========================
   MARK AS READ
========================= */

function markAsRead(id){

  let notifications =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  notifications =
    notifications.map(notification => {

      if(notification.id === id){

        return {
          ...notification,
          read:true
        };

      }

      return notification;

    });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(notifications)
  );

  renderNotifications();

}

/* =========================
   MARK ALL
========================= */

function markAllAsRead(){

  let notifications =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )
    ) || [];

  notifications =
    notifications.map(notification => {

      const isTechnicianNotification =

        notification.userType ===
        "technician"

        &&

        (
          notification.userId === currentTechnician.id
          ||
          notification.targetId === currentTechnician.id
          ||
          notification.recipientId === currentTechnician.id
        );

      if(isTechnicianNotification){

        return {
          ...notification,
          read:true
        };

      }

      return notification;

    });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(notifications)
  );

  document.getElementById(
    "markAllCheckbox"
  ).checked = false;

  renderNotifications();

}

/* =========================
   RENDER
========================= */

function renderNotifications(){

  const list =
    document.getElementById(
      "notificationList"
    );

  const empty =
    document.getElementById(
      "emptyState"
    );

  list.innerHTML = "";

  let notifications =
    getNotifications();

  /* FILTERS */

  if(currentFilter === "read"){

    notifications =
      notifications.filter(
        notification =>

          notification.read
      );

  }

  if(currentFilter === "unread"){

    notifications =
      notifications.filter(
        notification =>

          !notification.read
      );

  }

  /* EMPTY */

  if(notifications.length === 0){

    empty.style.display =
      "block";

    return;

  }

  empty.style.display =
    "none";

  /* RENDER */

  notifications.forEach(notification => {

    const card =
      document.createElement("div");

    card.className =
      `card ${
        !notification.read
        ? "unread"
        : ""
      }`;

    card.innerHTML = `

      <div class="
        icon
        ${getTypeClass(notification.type)}
      ">

        <i class="
          fas
          ${getTypeIcon(notification.type)}
        "></i>

      </div>

      <div class="content">

        <div class="topRow">

          <div>

            <div class="title">

              ${
                notification.title ||
                "Notification"
              }

            </div>

            <div class="message">

              ${
                notification.message ||
                "No message"
              }

            </div>

          </div>

        </div>

        <div class="time">

          ${
            formatTime(
              notification.createdAt
            )
          }

        </div>

        <div class="cardActions">

          ${
            notification.read

            ?

            `
              <div class="readBadge">
                Read
              </div>
            `

            :

            `
              <button
                class="readBtn"
                onclick="markAsRead('${notification.id}')"
              >
                Mark as Read
              </button>
            `
          }

        </div>

      </div>

    `;

    list.appendChild(card);

  });

}

/* =========================
   REALTIME UPDATE
========================= */

renderNotifications();

/* realtime cross-tab */
window.addEventListener(
  "storage",
  renderNotifications
);

/* realtime same tab */


</script>

</body>
</html>
