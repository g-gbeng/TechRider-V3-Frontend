<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Technician Notifications - TechRider
</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/notifications-technician.css">
<script src="js/api.js" data-require-role="technician"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div class="headerLeft">

      <h2>
        Notifications
      </h2>

      <p>
        View updates, alerts and admin messages
      </p>

    </div>

    <a
      href="dashboard-technician.html"
      class="back"
    >
      <i class="fas fa-arrow-left"></i>
      Dashboard
    </a>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="filters">

      <button
        class="filterBtn active"
        onclick="setFilter('all', this)"
      >
        All
      </button>

      <button
        class="filterBtn"
        onclick="setFilter('unread', this)"
      >
        Unread
      </button>

      <button
        class="filterBtn"
        onclick="setFilter('read', this)"
      >
        Read
      </button>

    </div>

    <div class="actions">

      <label class="markAll">

        <input
          type="checkbox"
          id="markAllCheckbox"
          onchange="markAllAsRead()"
        >

        Mark all as read

      </label>

    </div>

  </div>

  <!-- LIST -->
  <div
    class="list"
    id="notificationList"
  ></div>

  <!-- EMPTY -->
  <div
    class="empty"
    id="emptyState"
  >

    <i class="fas fa-bell-slash"></i>

    <h3>
      No Notifications
    </h3>

    <p>
      Notifications from admin will appear here.
    </p>

  </div>

</div>

<script src="js/pages/notifications-technician.js"></script>

</body>
</html>
