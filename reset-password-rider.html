<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Reset Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --light-purple:#f3e8ff;
      --lilac:#e0aaff;
      --lilac-dark:#c77dff;
      --purple:#5a189a;
      --deep-purple:#240046;
    }

    body{
      min-height:100vh;
      background:var(--light-purple);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:430px;
      background:#fff;
      border-radius:18px;
      padding:28px;
      box-shadow:0 18px 45px rgba(36,0,70,0.15);
      animation:fadeIn 0.8s ease-in;
    }

    .header{
      text-align:center;
      margin-bottom:18px;
    }

    .header .icon{
      width:55px;
      height:55px;
      margin:0 auto 10px;
      border-radius:14px;
      background:var(--purple);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:1.3rem;
    }

    .header h2{
      color:var(--purple);
      font-size:1.6rem;
    }

    .header p{
      color:#666;
      font-size:0.9rem;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:18px;
    }

    .input-group{
      position:relative;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:var(--deep-purple);
    }

    input{
      padding:12px;
      border:1px solid #ddd;
      border-radius:10px;
      outline:none;
      transition:0.3s;
    }

    input:focus{
      border-color:var(--purple);
      box-shadow:0 0 0 3px rgba(90,24,154,0.15);
    }

    .toggle-password{
      position:absolute;
      right:12px;
      top:38px;
      cursor:pointer;
      color:#777;
    }

    .btn{
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg,var(--purple),var(--lilac-dark));
      color:#fff;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .back-link{
      text-align:center;
      margin-top:14px;
      font-size:0.85rem;
    }

    .back-link a{
      color:var(--purple);
      text-decoration:none;
    }

    .back-link a:hover{
      text-decoration:underline;
    }

    .error{
      font-size:0.78rem;
      color:red;
      display:none;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(15px);}
      to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Create a new secure password</p>
    </div>

    <form id="resetForm">

      <div class="input-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required>
        <i class="fas fa-eye toggle-password" id="toggleNew"></i>
        <div class="error" id="passwordError">
          Must be 8+ chars, include uppercase, number & special character
        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
        <i class="fas fa-eye toggle-password" id="toggleConfirm"></i>
        <div class="error" id="matchError">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn">Update Password</button>

    </form>

    <div class="back-link">
      <a href="login-rider.html">Back to Login</a>
    </div>

  </div>

  <script>

    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const resetForm = document.getElementById('resetForm');

    const passwordError = document.getElementById('passwordError');
    const matchError = document.getElementById('matchError');

    const toggleNew = document.getElementById('toggleNew');
    const toggleConfirm = document.getElementById('toggleConfirm');

    function validatePassword(pwd){
      return pwd.length >= 8 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd) && /[!@#$%^&*(),.?":{}|<>]/.test(pwd);
    }

    toggleNew.addEventListener('click', ()=>{
      newPassword.type = newPassword.type === 'password' ? 'text' : 'password';
      toggleNew.classList.toggle('fa-eye-slash');
    });

    toggleConfirm.addEventListener('click', ()=>{
      confirmPassword.type = confirmPassword.type === 'password' ? 'text' : 'password';
      toggleConfirm.classList.toggle('fa-eye-slash');
    });

    resetForm.addEventListener('submit',(e)=>{
      e.preventDefault();

      let valid = true;

      if(!validatePassword(newPassword.value)){
        passwordError.style.display='block';
        valid=false;
      } else {
        passwordError.style.display='none';
      }

      if(newPassword.value !== confirmPassword.value){
        matchError.style.display='block';
        valid=false;
      } else {
        matchError.style.display='none';
      }

      if(valid){
        window.location.href = "dashboard-rider.html";
      }

    });

  </script>

</body>
</html>
