<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>TechRider - Admin Records</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
}

body{
background:var(--gray);
padding:25px;
animation:fadeIn .45s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Top */

.topbar{
background:white;
padding:20px 24px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;
}

.backBtn{
background:linear-gradient(
135deg,
var(--purple),
var(--lilac)
);
border:none;
color:white;
padding:12px 16px;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

/* Search */

.searchWrap{
background:white;
padding:18px;
border-radius:18px;
margin-bottom:20px;
}

.searchWrap input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
}

/* Role filter */

.tabs{
display:flex;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}

.tab{
padding:12px 16px;
background:white;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:var(--purple);
color:white;
}

/* Records */

.records{
display:grid;
gap:22px;
}

.record{
background:white;
padding:26px;
border-radius:20px;
border:2px solid transparent;
transition:.35s;
}

.record.highlighted{
border-color:var(--purple);
box-shadow:
0 0 0 6px rgba(
90,24,154,.10
);
}

.selectedLabel{
display:none;
background:var(--lilac);
padding:8px 12px;
border-radius:20px;
margin-bottom:14px;
font-size:.85rem;
font-weight:600;
}

.record.highlighted .selectedLabel{
display:inline-block;
}

.roleTag{
display:inline-block;
margin-bottom:12px;
padding:8px 12px;
border-radius:18px;
font-size:.8rem;
background:#f2ecff;
color:var(--purple);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
flex-wrap:wrap;
gap:12px;
}

.status{
padding:8px 14px;
border-radius:20px;
font-size:.8rem;
font-weight:600;
}

.approved{
background:#e9d8fd;
color:var(--purple);
}

.suspended{
background:#ffe5e5;
color:#b00020;
}

/* Details */

.detailsGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-bottom:18px;
}

.field{
background:#faf7ff;
padding:14px;
border-radius:12px;
}

.label{
font-size:.8rem;
color:#777;
margin-bottom:4px;
}

.value{
font-weight:600;
color:var(--deep-purple);
}

/* Images */

.images{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.imgBox{
border:2px dashed #ddd;
padding:28px;
border-radius:16px;
text-align:center;
background:#fcfbff;
}

@media(max-width:768px){

.detailsGrid{
grid-template-columns:1fr;
}

.images{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>


<div class="topbar">

<h2>
Admin Records
</h2>

<button
class="backBtn"
onclick="history.back()">
Go Back
</button>

</div>



<div class="searchWrap">

<input
id="searchBox"
placeholder="Search records...">

</div>



<div class="tabs">

<div
class="tab active"
onclick="filterRole('all',this)">
All
</div>

<div
class="tab"
onclick="filterRole('technician',this)">
Technicians
</div>

<div
class="tab"
onclick="filterRole('rider',this)">
Riders
</div>

</div>



<div
class="records"
id="recordsContainer">


<!-- Technician -->


<script>
/* ===========================================================
   TECHRIDER ADMIN RECORDS
   PART 1
=========================================================== */

/* -----------------------------
   STORAGE
------------------------------ */

const technicians =
JSON.parse(
localStorage.getItem(
"techrider_technicians"
)
) || [];

const riders =
JSON.parse(
localStorage.getItem(
"techrider_riders"
)
) || [];

const recordsContainer =
document.getElementById(
"recordsContainer"
);

const searchBox =
document.getElementById(
"searchBox"
);

/* -----------------------------
   URL PARAMETERS
------------------------------ */

const params =
new URLSearchParams(
window.location.search
);

const selectedName =
params.get("tech") ||
params.get("rider");

/* -----------------------------
   HELPERS
------------------------------ */

function formatDate(date){

if(!date) return "N/A";

return new Date(date)
.toLocaleDateString(
undefined,
{
year:"numeric",
month:"short",
day:"numeric"
}
);

}

function imageBox(title,image){

if(!image){

return `

<div class="imgBox">

<strong>${title}</strong>

<br><br>

No document uploaded

</div>

`;

}

return `

<div class="imgBox">

<strong>${title}</strong>

<br><br>

<img
src="${image}"
style="
width:100%;
max-height:220px;
object-fit:contain;
border-radius:10px;
">

</div>

`;

}

/* -----------------------------
   RENDER TECHNICIAN
------------------------------ */

function createTechnicianCard(tech){

const status =
tech.suspended
? "Suspended"
: "Approved";

const statusClass =
tech.suspended
? "suspended"
: "approved";

return `

<div
class="record"
data-role="technician"
data-name="${tech.fullName}"
>

<div class="selectedLabel">
Selected Record
</div>

<div class="roleTag">
Technician
</div>

<div class="header">

<h3>

${tech.fullName}

</h3>

<span class="status ${statusClass}">

${status}

</span>

</div>

<div class="detailsGrid">

<div class="field">

<div class="label">
Email
</div>

<div class="value">

${tech.email || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Phone
</div>

<div class="value">

${tech.phone || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Address
</div>

<div class="value">

${tech.address || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Experience
</div>

<div class="value">

${tech.experience || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Submitted
</div>

<div class="value">

${formatDate(
tech.submittedAt
)}

</div>

</div>

</div>

<button
class="backBtn toggleDocs"
style="
margin-bottom:20px;
"
>

View Documents ▼

</button>

<div
class="images"
style="display:none;"
>

${imageBox(
"Facial Verification",
tech.facialImage
)}

${imageBox(
"Government ID",
tech.governmentId
)}

${imageBox(
"Business License",
tech.businessLicense
)}

</div>

</div>

`;

}

/* -----------------------------
   INITIAL RENDER
------------------------------ */

function renderRecords(){

recordsContainer.innerHTML = "";

/* ---------- TECHNICIANS ---------- */

technicians.forEach(tech=>{

recordsContainer.innerHTML +=

createTechnicianCard(tech);

});

/* Riders will be added
   in Part 2 */

}

/* ===========================================================
   TECHRIDER ADMIN RECORDS
   PART 2
=========================================================== */

/* -----------------------------
   RENDER RIDER
------------------------------ */

function createRiderCard(rider){

const status =
rider.suspended
? "Suspended"
: "Approved";

const statusClass =
rider.suspended
? "suspended"
: "approved";

return `

<div
class="record"
data-role="rider"
data-name="${rider.fullName}"
>

<div class="selectedLabel">
Selected Record
</div>

<div class="roleTag">
Rider
</div>

<div class="header">

<h3>

${rider.fullName}

</h3>

<span class="status ${statusClass}">

${status}

</span>

</div>

<div class="detailsGrid">

<div class="field">

<div class="label">
Email
</div>

<div class="value">

${rider.email || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Phone
</div>

<div class="value">

${rider.phone || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Address
</div>

<div class="value">

${rider.address || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Vehicle Type
</div>

<div class="value">

${rider.vehicleType || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Plate Number
</div>

<div class="value">

${rider.plateNumber || "N/A"}

</div>

</div>

<div class="field">

<div class="label">
Submitted
</div>

<div class="value">

${formatDate(
rider.submittedAt
)}

</div>

</div>

</div>

<button
class="backBtn toggleDocs"
style="
margin-bottom:20px;
">

View Documents ▼

</button>

<div
class="images"
style="display:none;"
>

${imageBox(
"Facial Verification",
rider.facialImage
)}

${imageBox(
"Driver's License",
rider.driversLicense
)}

${imageBox(
"Government ID",
rider.governmentId
)}

</div>

</div>

`;

}

/* -----------------------------
   COMPLETE RENDER
------------------------------ */

const originalRender =
renderRecords;

renderRecords = function(){

recordsContainer.innerHTML = "";

/* Technicians */

technicians.forEach(tech=>{

recordsContainer.innerHTML +=
createTechnicianCard(tech);

});

/* Riders */

riders.forEach(rider=>{

recordsContainer.innerHTML +=
createRiderCard(rider);

});

/* Enable document toggles */

setupDocumentButtons();

};

/* -----------------------------
   DOCUMENT TOGGLE
------------------------------ */

function setupDocumentButtons(){

document
.querySelectorAll(".toggleDocs")
.forEach(button=>{

button.onclick = function(){

const images =

this.nextElementSibling;

const opened =

images.style.display === "grid";

images.style.display =

opened
? "none"
: "grid";

this.innerHTML =

opened
? "View Documents ▼"
: "Hide Documents ▲";

};

});

}

/* ===========================================================
   TECHRIDER ADMIN RECORDS
   PART 3
=========================================================== */

/* -----------------------------
   SEARCH
------------------------------ */

searchBox.addEventListener(
"input",
function(){

const query =
this.value
.toLowerCase()
.trim();

document
.querySelectorAll(".record")
.forEach(card=>{

const name =
(card.dataset.name || "")
.toLowerCase();

const role =
(card.dataset.role || "")
.toLowerCase();

const text =
card.innerText
.toLowerCase();

const match =

name.includes(query) ||

role.includes(query) ||

text.includes(query);

card.style.display =
match
? "block"
: "none";

});

});

/* -----------------------------
   ROLE FILTER
------------------------------ */

function filterRole(role,tab){

document
.querySelectorAll(".tab")
.forEach(button=>
button.classList.remove(
"active"
)
);

tab.classList.add(
"active"
);

document
.querySelectorAll(".record")
.forEach(card=>{

if(
role==="all" ||
card.dataset.role===role
){

card.style.display="block";

}else{

card.style.display="none";

}

});

}

/* -----------------------------
   HIGHLIGHT RECORD
------------------------------ */

function highlightSelectedRecord(){

if(!selectedName){

return;

}

const cards =
document.querySelectorAll(
".record"
);

cards.forEach(card=>{

if(
card.dataset.name ===
selectedName
){

card.classList.add(
"highlighted"
);

/* Automatically expand documents */

const images =
card.querySelector(".images");

const button =
card.querySelector(".toggleDocs");

if(images){

images.style.display =
"grid";

}

if(button){

button.innerHTML =
"Hide Documents ▲";

}

/* Smooth scroll */

setTimeout(()=>{

card.scrollIntoView({

behavior:"smooth",

block:"center"

});

},300);

}

});

}

/* -----------------------------
   EMPTY STATE
------------------------------ */

function showEmptyMessage(){

if(

technicians.length===0 &&

riders.length===0

){

recordsContainer.innerHTML =

`

<div
style="
background:white;
padding:60px;
border-radius:20px;
text-align:center;
color:#777;
font-size:1rem;
">

No approved technicians or riders found.

</div>

`;

}

}

/* -----------------------------
   INITIALIZE
------------------------------ */

showEmptyMessage();

renderRecords();

highlightSelectedRecord();

/* -----------------------------
   READY
------------------------------ */

console.log(
"TechRider Records Ready"
);


</script>

</body>
</html>
