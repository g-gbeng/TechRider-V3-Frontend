<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>TechRider - Admin Records</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/admin-records.css">
<script src="js/api.js" data-require-role="admin"></script>
</head>

<body>


<div class="topbar">

<h2>
Admin Records
</h2>

<button
class="backBtn"
onclick="history.back()">
Go Back
</button>

</div>



<div class="searchWrap">

<input
id="searchBox"
placeholder="Search records...">

</div>



<div class="tabs">

<div
class="tab active"
onclick="filterRole('all',this)">
All
</div>

<div
class="tab"
onclick="filterRole('technician',this)">
Technicians
</div>

<div
class="tab"
onclick="filterRole('rider',this)">
Riders
</div>

</div>



<div
class="records"
id="recordsContainer">


<!-- Technician -->


<script src="js/pages/admin-records.js"></script>

</body>
</html>
