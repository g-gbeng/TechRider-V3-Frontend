<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

content="width=device-width,initial-scale=1.0">

<title>TechRider - Admin Records</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

<body>


<div class="topbar">

<h2>
Admin Records
</h2>

<button
class="backBtn"
onclick="history.back()">

</button>

</div>



<div class="searchWrap">

<input
id="searchBox"

<div class="tabs">

class="tab active"
onclick="filterRole('all',this)">
All
</div>

<div
class="tab"
onclick="filterRole('technician',this)">
Technicians
</div>

<div
class="tab"
onclick="filterRole('rider',this)">
Riders
</div>

</div>



<div
class="records"
id="recordsContainer">


<!-- Technician -->


<script src="js/pages/admin-records.js"></script>
