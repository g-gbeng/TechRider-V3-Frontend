<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>
  <title>TechRider - Customer Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/profile-customer.css">
  <script src="js/api.js" data-require-role="customer"></script>
<script src="js/ui.js"></script>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="profile-info">

        <!-- PROFILE IMAGE -->
        <div class="avatar-wrapper">

          <div class="avatar" id="avatar">
            U
          </div>

          <button
            class="upload-btn"
            id="uploadTrigger"
          >
            <i class="fas fa-camera"></i>
          </button>

          <input
            type="file"
            id="profileImageInput"
            accept="image/*"
            hidden
          >

        </div>
        <button type="button" class="tr-remove-photo" id="removePhotoBtn" hidden><i class="fas fa-trash-can"></i> Remove photo</button>

        <!-- NAME -->
        <div class="name">

          <h2 id="name">
            User
          </h2>

          <p>
            Customer Account
          </p>

        </div>

      </div>

      <!-- BACK -->
      <a
        href="dashboard-customer.html"
        class="back-btn"
      >

        <i class="fas fa-arrow-left"></i>
        Back

      </a>

    </div>

    <!-- BODY -->
    <div class="body">

      <!-- ACCOUNT DETAILS -->
      <div class="card">

        <h3>Account Details</h3>

        <div class="item">
          <span class="label">Email</span>

          <span
            class="value"
            id="email"
          >
            customer@email.com
          </span>
        </div>

        <div class="item">
          <span class="label">Phone</span>

          <span
            class="value"
            id="phone"
          >
            +234 XXX XXX XXXX
          </span>
        </div>

        <div class="item">
          <span class="label">Status</span>

          <span class="value">
            Active
          </span>
        </div>

      </div>

      <!-- ACTIVITY -->
      <div class="card">

        <h3>Activity</h3>

        <div class="item">
          <span class="label">Total Requests</span>

          <span
            class="value"
            id="totalRequests"
          >
            0
          </span>
        </div>

        <div class="item">
          <span class="label">Completed</span>

          <span
            class="value"
            id="completedRequests"
          >
            0
          </span>
        </div>

        <div class="item">
          <span class="label">Cancelled</span>

          <span
            class="value"
            id="cancelledRequests"
          >
            0
          </span>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="actions">

        <button
          class="btn primary"
          onclick="location.href='repair-request.html'"
        >

          Request Repair

        </button>

        <button
          class="btn secondary"
          onclick="location.href='reset-password.html?role=customer'"
        >

          Change Password

        </button>

        <button
          class="btn danger"
          id="logoutBtn"
        >

          Logout

        </button>

      </div>

    </div>

  </div>
  <div data-theme-picker data-theme-card data-theme-into=".container"></div>

  <script src="js/pages/profile-customer.js"></script>

</body>
</html>
