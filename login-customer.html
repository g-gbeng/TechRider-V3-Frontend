<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Customer Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --light-purple: #f3e8ff;
      --lilac: #e0aaff;
      --lilac-dark: #c77dff;
      --purple: #5a189a;
      --deep-purple: #240046;
    }

    body {
      min-height: 100vh;
      background: var(--light-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(36, 0, 70, 0.15);
      animation: fadeIn 0.8s ease-in;
    }

    /* TOP SIGNUP LINK */
    .top-link {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .top-link a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 500;
    }

    .top-link a:hover {
      text-decoration: underline;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
    }

    .header h2 {
      color: var(--purple);
      font-size: 1.6rem;
    }

    .header p {
      color: #666;
      font-size: 0.9rem;
    }

    /* FORM */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    label {
      font-size: 0.85rem;
      color: var(--deep-purple);
    }

    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: 0.3s;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(90, 24, 154, 0.15);
    }

    /* PASSWORD TOGGLE */
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 38px;
      cursor: pointer;
      color: #777;
    }

    /* BUTTON */
    .btn {
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        var(--purple),
        var(--lilac-dark)
      );
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 500;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    /* SIGNUP + LINKS */
    .bottom-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #555;
    }

    .bottom-link a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }

    .extra-links {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    .extra-links a {
      color: var(--purple);
      text-decoration: none;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .error-message {
      display: none;
      background: #ffe5e5;
      color: #d00000;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 500px) {

      .container {
        padding: 20px;
      }

      .header h2 {
        font-size: 1.3rem;
      }

      .extra-links {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="icon">
        <i class="fas fa-user"></i>
      </div>

      <h2>Customer Login</h2>
      <p>Welcome back to TechRider</p>

    </div>

    <!-- SIGNUP LINK -->
    <div class="top-link">
      Don’t have an account?
      <a href="signup-customer.html">Sign up</a>
    </div>

    <!-- FORM -->
    <form id="loginForm">

      <div class="input-group">

        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <i class="fas fa-eye toggle-password" id="togglePassword"></i>

      </div>

      <!-- ERROR MESSAGE -->
      <div class="error-message" id="loginError">
        Invalid email or password
      </div>

      <div class="extra-links">
        <a href="forgot-password-customer.html">
          Forgot Password?
        </a>
      </div>

      <button type="submit" class="btn">
        Login
      </button>

    </form>

    <!-- FOOTER NOTE -->
    <div class="bottom-link">
      Secure access for TechRider customers
    </div>

  </div>

  <script>

    const password = document.getElementById('password');

    const togglePassword =
      document.getElementById('togglePassword');

    const form =
      document.getElementById('loginForm');

    const loginError =
      document.getElementById('loginError');

    // TOGGLE PASSWORD
    togglePassword.addEventListener('click', () => {

      const type =
        password.type === 'password'
        ? 'text'
        : 'password';

      password.type = type;

      togglePassword.classList.toggle('fa-eye-slash');

    });

    // LOGIN FUNCTION
    form.addEventListener('submit', (e) => {

      e.preventDefault();

      const email =
        document.getElementById('email')
        .value
        .trim()
        .toLowerCase();

      const pwd =
        password.value;

      // GET STORED CUSTOMERS
      const customers =
        JSON.parse(
          localStorage.getItem('techrider_customers')
        ) || [];

      // FIND MATCHING CUSTOMER
      const matchedCustomer =
        customers.find(customer =>

          customer.email.toLowerCase() === email &&
          customer.password === pwd

        );

      // IF LOGIN SUCCESSFUL
      if (matchedCustomer) {

        // STORE CURRENT SESSION
        localStorage.setItem(
          'techrider_current_customer',
          JSON.stringify(matchedCustomer)
        );

        // HIDE ERROR
        loginError.style.display = 'none';

        // SUCCESS MESSAGE
        alert('Login successful!');

        // REDIRECT TO DASHBOARD
        window.location.href =
          "dashboard-customer.html";

      } else {

        // SHOW ERROR
        loginError.style.display = 'block';
      }

    });

  </script>

</body>
</html>
