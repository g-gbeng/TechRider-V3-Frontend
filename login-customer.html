<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Customer Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/login-customer.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="icon">
        <i class="fas fa-user"></i>
      </div>

      <h2>Customer Login</h2>
      <p>Welcome back to TechRider</p>

    </div>

    <!-- SIGNUP LINK -->
    <div class="top-link">
      Don’t have an account?
      <a href="signup-customer.html">Sign up</a>
    </div>

    <!-- FORM -->
    <form id="loginForm">

      <div class="input-group">

        <label>Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <i class="fas fa-eye toggle-password" id="togglePassword"></i>

      </div>

      <!-- ERROR MESSAGE -->
      <div class="error-message" id="loginError">
        Invalid email or password
      </div>

      <div class="extra-links">
        <a href="forgot-password-customer.html">
          Forgot Password?
        </a>
      </div>

      <button type="submit" class="btn">
        Login
      </button>

    </form>

    <!-- FOOTER NOTE -->
    <div class="bottom-link">
      Secure access for TechRider customers
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/pages/login-customer.js"></script>

</body>
</html>
