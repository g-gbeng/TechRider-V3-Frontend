<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechRider - Technician Signup</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --white:#fff;
    }

    body{
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
      animation:fadeIn 0.6s ease-in;
    }

    .container{
      width:100%;
      max-width:420px;
      background:var(--white);
      padding:25px;
      border-radius:16px;
      box-shadow:0 15px 40px rgba(0,0,0,0.1);
    }

    .header{
      text-align:center;
      margin-bottom:15px;
    }

    .logo{
      width:60px;
      height:60px;
      background:var(--lilac);
      color:var(--deep-purple);
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      margin:auto;
      font-size:1.4rem;
    }

    .header h2{
      margin-top:10px;
      color:var(--deep-purple);
    }

    .header p{
      margin-top:5px;
      color:#666;
      font-size:0.9rem;
    }

    .top-link{
      text-align:center;
      font-size:0.85rem;
      margin-bottom:15px;
    }

    .top-link a{
      color:var(--purple);
      text-decoration:none;
      font-weight:500;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:#444;
    }

    input,
    select{
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:0.9rem;
      transition:0.3s;
    }

    input:focus,
    select:focus{
      border-color:var(--purple);
      box-shadow:0 0 0 3px rgba(90,24,154,0.1);
    }

    input[type="file"]{
      padding:10px;
    }

    /* PASSWORD */

    .password-group{
      position:relative;
    }

    .password-group input{
      padding-right:45px;
    }

    .toggle{
      position:absolute;
      right:15px;
      top:43px;
      transform:translateY(-50%);
      cursor:pointer;
      color:#777;
      font-size:0.95rem;
    }

    /* BUTTON */

    .btn{
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      opacity:0.9;
      transform:translateY(-2px);
    }

    .links{
      text-align:center;
      font-size:0.85rem;
      margin-top:10px;
    }

    .links a{
      color:var(--purple);
      text-decoration:none;
      margin:0 5px;
      font-weight:500;
    }

    .links a:hover{
      text-decoration:underline;
    }

    @media(max-width:500px){

      .container{
        padding:20px;
      }

    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <i class="fas fa-tools"></i>
    </div>

    <h2>Technician Signup</h2>

    <p>Create your TechRider technician account</p>
  </div>

  <div class="top-link">
    Already have an account?
    <a href="login-technician.html">Log in</a>
  </div>

  <form class="form" id="signupForm">

    <div class="group">
      <label>Full Name</label>
      <input type="text" id="fullName" required>
    </div>

    <div class="group">
      <label>Email Address</label>
      <input type="email" id="email" required>
    </div>

    <div class="group">
      <label>Phone Number</label>
      <input
        type="tel"
        id="phone"
        maxlength="11"
        placeholder="Enter 11-digit phone number"
        required
      >
    </div>

    <div class="group">
      <label>Address</label>
      <input type="text" id="address" required>
    </div>

    <div class="group">
      <label>Specialization</label>

      <select id="specialization" required>
        <option value="">Select specialization</option>
        <option>Phone Repair</option>
        <option>Laptop Repair</option>
        <option>Tablet Repair</option>
        <option>Gaming Console Repair</option>
        <option>General Electronics</option>
      </select>
    </div>

    <div class="group">
      <label>Years of Experience</label>

      <input
        type="number"
        id="experience"
        min="0"
        placeholder="e.g. 3"
      >
    </div>

    <!-- FACIAL IMAGE -->

    <div class="group">
      <label>Upload Facial Image</label>

      <input
        type="file"
        id="facialImage"
        accept="image/*"
      >
    </div>

    <!-- BUSINESS LICENSE -->

    <div class="group">
      <label>Upload Business License</label>

      <input
        type="file"
        id="businessLicense"
        required
      >
    </div>

    <!-- PASSWORD -->

    <div class="group password-group">

      <label>Password</label>

      <input
        type="password"
        id="password"
        required
        pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[@#$!%*?&]).{8,}$"
        title="Must be at least 8 characters, include uppercase, number and special character"
      >

      <i
        class="fas fa-eye toggle"
        onclick="togglePassword(this)"
      ></i>

    </div>

    <!-- CONFIRM PASSWORD -->

    <div class="group password-group">

      <label>Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        required
      >

      <i
        class="fas fa-eye toggle"
        onclick="togglePassword(this)"
      ></i>

    </div>

    <button class="btn" type="submit">
      Create Technician Account
    </button>

    <div class="links">
      <a href="terms-of-service-technician.html">
        Terms of Service
      </a>

      |

      <a href="privacy-policy-technician.html">
        Privacy Policy
      </a>
    </div>

  </form>

</div>
<script>

function togglePassword(icon){
  const input = icon.previousElementSibling;

  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

/* PHONE LIMIT */
document.getElementById("phone").addEventListener("input", (e)=>{
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,11);
});

/* BASE64 IMAGE */
function toBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* FORM SUBMIT */
const form = document.getElementById("signupForm");

if(form){

  form.addEventListener("submit", async function(e){

    e.preventDefault(); // ALWAYS prevent reload first

    try {

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();
      const specialization = document.getElementById("specialization").value;
      const experience = document.getElementById("experience").value;

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
      }

      /* IMAGE (optional safe handling) */
      const imageFile = document.getElementById("facialImage")?.files[0];
      let facialImage = "";

      if(imageFile){
        facialImage = imageFile ? imageFile.name : "";
      }

      const newTech = {
        id: Date.now(),
        fullName,
        email,
        phone,
        address,
        specialization,
        experience,
        password,
        facialImage,
        createdAt: new Date().toISOString()
      };

      /* LOAD EXISTING */
      const technicians =
        JSON.parse(localStorage.getItem("techrider_technicians")) || [];

      /* CHECK DUPLICATE EMAIL */
      const exists = technicians.some(t => t.email === email);

      if(exists){
        alert("Email already exists");
        return;
      }

      technicians.push(newTech);

      localStorage.setItem(
        "techrider_technicians",
        JSON.stringify(technicians)
      );

      localStorage.setItem(
        "techrider_current_technician",
        JSON.stringify(newTech)
      );

      alert("Account created successfully");

      window.location.href = "login-technician.html";

    } catch (error) {
      console.error("Signup error:", error);
      alert("Something went wrong. Check console.");
    }

  });

}

</script> 

</body>
</html>
