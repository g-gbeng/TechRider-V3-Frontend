<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician Pending Approval - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/awaiting-approval-technician.css">
</head>

<body>

<div class="container">

  <div class="icon">
    <i class="fas fa-hourglass-half"></i>
  </div>

  <h2>Verification in Progress</h2>

  <p>
    Your account is currently under review.  
    You’ll be able to access your dashboard once verification is complete.
  </p>

  <div class="status">
    <div><i class="fas fa-id-card"></i> Business License Review</div>
    <div><i class="fas fa-user-check"></i> Identity Verification</div>
    <div><i class="fas fa-tools"></i> Skill Assessment</div>
  </div>

  <p style="margin-top:10px;font-size:0.8rem;">
    This usually takes a few hours to 24 hours.
  </p>

  <!-- REFRESH BUTTON -->
  <button class="btn refresh" onclick="checkApproval()">
    Refresh Status
  </button>

  <!-- LOGOUT BUTTON -->
  <button class="btn logout" onclick="logout()">
    Logout
  </button>

</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/awaiting-approval-technician.js"></script>

</body>
</html>
