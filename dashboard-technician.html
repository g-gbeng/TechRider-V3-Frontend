<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TechRider - Technician Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

:root{
  --purple:#5a189a;
  --deep-purple:#240046;
  --lilac:#e0aaff;
  --gray:#f6f6f6;
}

body{
  background:var(--gray);
  min-height:100vh;
  display:flex;
  animation:fadeIn .5s ease-in;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:linear-gradient(180deg,var(--purple),var(--deep-purple));
  color:white;
  padding:20px;
  position:fixed;
  height:100vh;
  transition:.3s;
}

.sidebar.collapsed{
  width:70px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.logo{
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--lilac);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--deep-purple);
  font-weight:bold;
}

.nav{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.nav a{
  color:white;
  text-decoration:none;
  padding:10px;
  border-radius:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

.sidebar.collapsed .text{
  display:none;
}

/* MAIN */
.main{
  margin-left:260px;
  width:calc(100% - 260px);
  padding:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:15px;
  border-radius:12px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--purple);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
  margin-top:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:14px;
}

.action{
  margin-top:20px;
  background:linear-gradient(135deg,var(--purple),#c77dff);
  color:white;
  padding:30px;
  border-radius:16px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .cards{
    grid-template-columns:1fr;
  }
}

/* FADE-IN */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="sidebar collapsed" id="sidebar">

  <div class="brand" onclick="toggleSidebar()">
    <div class="logo">T</div>
    <span class="text">Technician</span>
  </div>

  <div class="nav">
    <a href="available-jobs-technician.html"><i class="fas fa-briefcase"></i><span class="text">Available Jobs</span></a>
    <a href="active-jobs-technician.html"><i class="fas fa-spinner"></i><span class="text">Active Jobs</span></a>
    <a href="history-technician.html"><i class="fas fa-history"></i><span class="text">Job History</span></a>
    
    <!-- NEW NOTIFICATIONS LINK -->
    <a href="notifications-technician.html"><i class="fas fa-bell"></i><span class="text">Notifications</span></a>

    <a href="profile-technician.html"><i class="fas fa-user"></i><span class="text">Profile</span></a>
    <a href="login-technician.html"><i class="fas fa-sign-out-alt"></i><span class="text">Logout</span></a>
  </div>

</div>

<div class="main">

  <div class="topbar">
    <h3>Welcome, Technician</h3>

    <!-- UPDATED AVATAR LINK -->
    <a href="profile-technician.html" class="avatar">T</a>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Pending Requests</h3>
      <p>0 jobs available</p>
    </div>

    <div class="card">
      <h3>Active Jobs</h3>
      <p>0 ongoing jobs</p>
    </div>
  </div>

  <!-- CLICKABLE ACTION -->
  <div class="action" onclick="location.href='available-jobs-technician.html'">
    <h3>View Available Jobs</h3>
    <p>Accept new repair requests</p>
  </div>

</div>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}
</script>

</body>
</html>
