<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

:root{
  --purple:#5a189a;
  --deep-purple:#240046;
  --lilac:#e0aaff;
  --gray:#f6f6f6;
  --white:#fff;
}

body{
  background:var(--gray);
  padding:20px;
  animation:fadeIn .6s;
}

.container{max-width:900px;margin:auto;}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:10px;
}

.header h2{color:var(--deep-purple);}

.back-btn{
  background:var(--purple);
  color:white;
  padding:10px 14px;
  border-radius:10px;
  text-decoration:none;
  font-size:.85rem;
}

/* CARD */
.card{
  background:var(--white);
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

/* TOP */
.top{
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:var(--purple);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.5rem;
}

.name{
  font-weight:600;
  color:var(--deep-purple);
}

.badge{
  font-size:.8rem;
  color:#16a34a;
}

/* FORM */
.form{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.group{display:flex;flex-direction:column;gap:5px;}
.group.full{grid-column:span 2;}

label{font-size:.8rem;color:#555;}

input{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:.9rem;
}

input[readonly]{
  background:#f3f3f3;
  cursor:not-allowed;
}

/* PASSWORD */
.password-group{position:relative;}

.toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#777;
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,var(--purple),var(--lilac));
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .form{grid-template-columns:1fr;}
  .group.full{grid-column:span 1;}
  .back-btn{width:100%;text-align:center;}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>Technician Profile</h2>
  <a href="dashboard-technician.html" class="back-btn">← Back</a>
</div>

<!-- PROFILE INFO -->
<div class="card">

<div class="top">
  <div class="avatar">T</div>
  <div>
    <div class="name">Technician Name</div>
    <div class="badge"><i class="fas fa-check-circle"></i> Verified Technician</div>
  </div>
</div>

<form class="form">

<div class="group">
  <label>Full Name</label>
  <input type="text" value="Technician Name">
</div>

<div class="group">
  <label>Email</label>
  <input type="email" value="tech@example.com" readonly>
</div>

<div class="group">
  <label>Phone</label>
  <input type="text" value="+234XXXXXXXXXX" readonly>
</div>

<div class="group">
  <label>Specialization</label>
  <input type="text" value="Phone Repair" readonly>
</div>

<div class="group">
  <label>Years of Experience</label>
  <input type="number" value="3" readonly>
</div>

<div class="group full">
  <label>Address</label>
  <input type="text" value="Lagos, Nigeria" readonly>
</div>

</form>

<button class="btn">Save Changes</button>

</div>

<!-- PASSWORD CHANGE -->
<div class="card">

<h3 style="color:var(--deep-purple);margin-bottom:10px;">Change Password</h3>

<form class="form">

<div class="group password-group full">
  <label>Current Password</label>
  <input type="password">
  <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
</div>

<div class="group password-group">
  <label>New Password</label>
  <input type="password">
  <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
</div>

<div class="group password-group">
  <label>Confirm New Password</label>
  <input type="password">
  <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
</div>

<button class="btn">Update Password</button>

</form>

</div>

</div>

<script>
function togglePassword(icon){
  const input = icon.previousElementSibling;

  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}
</script>

</body>
</html>
