<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>
  Technician Profile
</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/profile-technician.css">
<script src="js/api.js" data-require-role="technician"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h2>
      Technician Profile
    </h2>

    <a
      href="dashboard-technician.html"
      class="back-btn"
    >
      <i class="fas fa-arrow-left"></i>
      Back
    </a>

  </div>

  <!-- PROFILE CARD -->

  <div class="card">

    <div class="top">

      <div class="profile-left">

        <div
          class="avatar"
          id="avatar"
        >
          T
        </div>

        <div>

          <div
            class="name"
            id="profileName"
          >
            Technician Name
          </div>

          <div class="badge">

            <i class="fas fa-check-circle"></i>
            Verified Technician

          </div>

        </div>

      </div>

      <!-- IMAGE UPLOAD -->

      <label class="upload-btn">

        <i class="fas fa-camera"></i>
        Upload Photo

        <input
          type="file"
          id="profileUpload"
          accept="image/*"
        >

      </label>

    </div>

    <!-- DETAILS -->

    <h3 class="section-title">
      Technician Details
    </h3>

    <div class="details">

      <div class="item">
        <label>Full Name</label>
        <p id="fullName">
          -
        </p>
      </div>

      <div class="item">
        <label>Email Address</label>
        <p id="email">
          -
        </p>
      </div>

      <div class="item">
        <label>Phone Number</label>
        <p id="phone">
          -
        </p>
      </div>

      <div class="item">
        <label>Specialization</label>
        <p id="specialization">
          -
        </p>
      </div>

      <div class="item">
        <label>Location</label>
        <p id="location">
          -
        </p>
      </div>

      <div class="item">
        <label>Experience</label>
        <p id="experience">
          -
        </p>
      </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions">

      <a
        href="available-jobs-technician.html"
        class="action-btn jobs-btn"
      >
        <i class="fas fa-briefcase"></i>
        Available Jobs
      </a>

      <a
        href="reset-password.html?role=technician"
        class="action-btn password-btn"
      >
        <i class="fas fa-lock"></i>
        Change Password
      </a>

      <a
        href="login-technician.html"
        class="action-btn logout-btn"
        onclick="logoutTechnician()"
      >
        <i class="fas fa-sign-out-alt"></i>
        Logout
      </a>

    </div>

  </div>

</div>
  <div data-theme-picker data-theme-card data-theme-into=".container"></div>

<script src="js/pages/profile-technician.js"></script>

</body>
</html>
