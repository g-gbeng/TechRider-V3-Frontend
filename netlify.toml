# Netlify settings for the TechRider website.
# Before the first deploy, replace techrider-api.onrender.com below with your
# Render API's address (Render shows it at the top of the service page).
# Full steps: the backend README, "Going live".

[build]
  publish = "."

# Send API calls to the API server. The browser only ever talks to this site,
# so the login cookie works in every browser (including Safari).
# Netlify signs each forwarded request with the NETLIFY_PROXY_SECRET variable
# (set it in Site configuration > Environment variables, same value as on Render).
[[redirects]]
  from = "/api/*"
  to = "https://techrider-api.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "NETLIFY_PROXY_SECRET"

# Uploaded files when Cloudinary is not set up (not recommended online)
[[redirects]]
  from = "/uploads/*"
  to = "https://techrider-api.onrender.com/uploads/:splat"
  status = 200
  force = true

# Friendly page for addresses that don't exist
[[redirects]]
  from = "/*"
  to = "/techrider-404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Scripts and styles change with each update: always check for a new version
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
