<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Reset Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/reset-password.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Create a new secure password</p>
    </div>

    <form id="resetForm">

      <div class="input-group" id="currentPasswordGroup" hidden>
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password">
        <i class="fas fa-eye toggle-password" id="toggleCurrent"></i>
      </div>

      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" required>
        <i class="fas fa-eye toggle-password" id="toggleNew"></i>
        <div class="error" id="passwordError">
          Must be 8+ chars, include uppercase, number & special character
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required>
        <i class="fas fa-eye toggle-password" id="toggleConfirm"></i>
        <div class="error" id="matchError">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn">Update Password</button>

    </form>

    <div class="back-link">
      <a href="login-customer.html" id="loginLink">Back to login</a>
    </div>

  </div>

  <script src="js/api.js"></script>
<script src="js/ui.js"></script>
  <script src="js/pages/reset-password.js"></script>

</body>
</html>
