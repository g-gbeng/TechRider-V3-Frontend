<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>
<title>Rider Pending Approval - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/awaiting-approval-rider.css">
</head>
<body>
<button data-theme-toggle class="tr-theme-floating" aria-label="Theme"></button>

<div class="container">

<div class="icon">
<i class="fas fa-hourglass-half"></i>
</div>

<h2>Verification in Progress</h2>

<p>
Your rider account is currently under review.
Access to your dashboard will be granted after approval.
</p>

<div class="status">
<div>
<i class="fas fa-id-card"></i>
Driver's License Review
</div>

<div>
<i class="fas fa-face-smile"></i>
Facial Verification
</div>

<div>
<i class="fas fa-motorcycle"></i>
Vehicle & Plate Verification
</div>
</div>

<p style="margin-top:10px;font-size:0.8rem;">
This usually takes a few hours to 24 hours.
</p>

<button
class="btn refresh"
onclick="checkApproval()">
Refresh Status
</button>

<button
class="btn logout"
onclick="logout()">
Logout
</button>

</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/awaiting-approval-rider.js"></script>

</body>
</html>
