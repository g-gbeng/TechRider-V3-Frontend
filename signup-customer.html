<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Customer Signup</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/signup-customer.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="icon">
        <i class="fas fa-user"></i>
      </div>

      <h2>Customer Signup</h2>
      <p>Create your TechRider customer account</p>
    </div>

    <!-- LOGIN LINK -->
    <div class="top-link">
      Already have an account?
      <a href="login-customer.html">Log in</a>
    </div>

    <form id="signupForm">

      <div class="input-group">
        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="input-group">
        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-group">
        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          maxlength="11"
          inputmode="numeric"
          pattern="[0-9]{11}"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create password"
          required
        >

        <i class="fas fa-eye toggle-password" id="togglePassword"></i>

        <div class="error" id="passwordError">
          Password must be 8+ chars, include uppercase,
          number & special character
        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          required
        >

        <i class="fas fa-eye toggle-password" id="toggleConfirm"></i>

        <div class="error" id="matchError">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn" id="createBtn">
        Create Account
      </button>

      <div class="bottom-links">
        <a href="terms-of-service-customer.html">
          Terms of Service
        </a>

        <a href="privacy-policy-customer.html">
          Privacy Policy
        </a>
      </div>

    </form>

  </div>

  <script src="js/api.js"></script>
  <script src="js/pages/signup-customer.js"></script>

</body>
</html>
