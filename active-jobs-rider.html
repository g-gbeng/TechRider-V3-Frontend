<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Active Deliveries - TechRider
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/active-jobs-rider.css">
<script src="js/api.js" data-require-role="rider"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="wrapper">

<div class="topbar">

<a
href="dashboard-rider.html"
class="back-btn">

<i class="fas fa-arrow-left"></i>
Back to Dashboard

</a>

<div class="page-title">

<h2>
Active Deliveries
</h2>

<p>
Monitor and complete your ongoing rider deliveries.
</p>

</div>

</div>

<div
class="jobs-container"
id="jobsContainer">
</div>

<div
class="empty-state"
id="emptyState">
</div>

</div>

<!-- COMPLETE MODAL -->
<div
class="modal"
id="completeModal">

<div class="modal-content">

<h3 id="completeTitle">
Complete Delivery
</h3>

<p id="completeText">
Are you sure you want to mark this delivery as completed?
</p>

<div class="handover-field" id="handoverField" hidden>
<label for="handoverInput">Handover code</label>
<input id="handoverInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="4 digits">
<small id="handoverHelp">Ask the person receiving the device for the 4-digit code in their TechRider app.</small>
<div class="handover-error" id="handoverError" role="alert"></div>
</div>

<div class="modal-actions">

<button
class="btn cancel-btn"
onclick="closeCompleteModal()">

Cancel

</button>

<button
class="btn confirm-btn"
id="completeConfirmBtn"
onclick="confirmCompleteDelivery()">

Mark Completed

</button>

</div>

</div>

</div>

<script src="js/chat.js"></script>
<script src="js/pages/active-jobs-rider.js"></script>

</body>
</html>
