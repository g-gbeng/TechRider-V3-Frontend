<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Active Deliveries - TechRider
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
--white:#fff;
--green:#10b981;
--orange:#f59e0b;
}

body{
background:var(--gray);
padding:20px;
animation:fadeIn .4s ease;
overflow-x:hidden;
}

.wrapper{
max-width:1200px;
margin:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:24px;
}

.back-btn{
text-decoration:none;
background:white;
padding:12px 18px;
border-radius:14px;
font-weight:600;
color:var(--purple);
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.page-title h2{
color:var(--deep-purple);
font-size:2rem;
}

.page-title p{
margin-top:6px;
color:#666;
font-size:.95rem;
}

.jobs-container{
display:flex;
flex-direction:column;
gap:22px;
}

.job-card{
background:var(--white);
border-radius:22px;
padding:24px;
box-shadow:0 6px 20px rgba(0,0,0,.05);
border:1px solid #eee;
animation:fadeIn .4s ease;
}

.job-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
flex-wrap:wrap;
margin-bottom:22px;
}

.job-id{
font-size:1.05rem;
font-weight:700;
color:var(--deep-purple);
margin-bottom:10px;
}

.job-time{
font-size:.88rem;
color:#777;
}

.badges{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.tag{
padding:8px 14px;
border-radius:999px;
font-size:.78rem;
font-weight:700;
}

.pickup{
background:#ede9fe;
color:var(--purple);
}

.delivery{
background:#dcfce7;
color:#047857;
}

.status-tag{
background:#fff7ed;
color:#c2410c;
}

.flow-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:24px;
}

.flow-box{
background:#faf7ff;
padding:20px;
border-radius:18px;
border:1px solid #eee;
}

.flow-head{
display:flex;
align-items:center;
gap:10px;
margin-bottom:16px;
color:var(--deep-purple);
font-weight:700;
}

.flow-head i{
background:#ede9fe;
width:38px;
height:38px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:var(--purple);
}

.info-row{
margin-bottom:14px;
line-height:1.7;
color:#444;
font-size:.94rem;
word-break:break-word;
}

.info-row strong{
color:#222;
}

.route-box{
background:white;
border-radius:16px;
padding:16px;
margin-top:18px;
border:1px dashed #d8b4fe;
}

.route-step{
display:flex;
gap:14px;
margin-bottom:16px;
align-items:flex-start;
}

.route-step:last-child{
margin-bottom:0;
}

.route-icon{
min-width:38px;
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#f3e8ff;
color:var(--purple);
font-size:.9rem;
}

.route-content{
font-size:.93rem;
line-height:1.7;
color:#444;
}

.route-content strong{
display:block;
color:var(--deep-purple);
margin-bottom:4px;
}

.actions{
display:flex;
justify-content:flex-end;
gap:14px;
flex-wrap:wrap;
}

.btn{
border:none;
padding:13px 20px;
border-radius:12px;
font-weight:600;
cursor:pointer;
transition:.25s;
font-size:.92rem;
}

.btn:hover{
transform:translateY(-2px);
}

.complete-btn{
background:linear-gradient(
135deg,
var(--purple),
#c77dff
);
color:white;
}

.empty-state{
display:none;
background:white;
padding:60px 20px;
border-radius:22px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.empty-state i{
font-size:3rem;
color:var(--purple);
margin-bottom:18px;
}

.empty-state h3{
color:var(--deep-purple);
margin-bottom:10px;
}

.empty-state p{
color:#777;
line-height:1.7;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:5000;
}

.modal-content{
background:white;
width:100%;
max-width:420px;
padding:28px;
border-radius:22px;
animation:fadeIn .3s ease;
}

.modal-content h3{
color:var(--deep-purple);
margin-bottom:14px;
}

.modal-content p{
line-height:1.7;
color:#555;
margin-bottom:24px;
}

.modal-actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.modal-actions .btn{
flex:1;
}

.confirm-btn{
background:linear-gradient(
135deg,
var(--purple),
#c77dff
);
color:white;
}

.cancel-btn{
background:#efefef;
}

@media(max-width:900px){

.flow-grid{
grid-template-columns:1fr;
}

}

@media(max-width:768px){

body{
padding:14px;
}

.page-title h2{
font-size:1.6rem;
}

.job-card{
padding:18px;
border-radius:18px;
}

.flow-box{
padding:16px;
}

.actions{
flex-direction:column;
}

.actions .btn{
width:100%;
}

.modal-actions{
flex-direction:column;
}

.modal-actions .btn{
width:100%;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="topbar">

<a
href="dashboard-rider.html"
class="back-btn">

<i class="fas fa-arrow-left"></i>
Back to Dashboard

</a>

<div class="page-title">

<h2>
Active Deliveries
</h2>

<p>
Monitor and complete your ongoing rider deliveries.
</p>

</div>

</div>

<div
class="jobs-container"
id="jobsContainer">
</div>

<div
class="empty-state"
id="emptyState">

<i class="fas fa-truck"></i>

<h3>
No Active Deliveries
</h3>

<p>
Accepted rider deliveries will appear here.
</p>

</div>

</div>

<!-- COMPLETE MODAL -->
<div
class="modal"
id="completeModal">

<div class="modal-content">

<h3>
Complete Delivery
</h3>

<p>
Are you sure you want to mark this delivery as completed?
</p>

<div class="modal-actions">

<button
class="btn cancel-btn"
onclick="closeCompleteModal()">

Cancel

</button>

<button
class="btn confirm-btn"
onclick="confirmCompleteDelivery()">

Mark Completed

</button>

</div>

</div>

</div>

<script>

/* =========================
CURRENT RIDER
========================= */
const currentRider =
JSON.parse(localStorage.getItem('techrider_currentUser')) ||
JSON.parse(localStorage.getItem('currentUser')) ||
JSON.parse(localStorage.getItem('riderCurrentUser'));

/* =========================
STORAGE
========================= */
let activeJobs =
JSON.parse(localStorage.getItem('activeRiderJobs')) || [];

let deliveryHistory =
JSON.parse(localStorage.getItem('riderDeliveryHistory')) || [];

let selectedJobId = null;

/* =========================
LOAD ACTIVE DELIVERIES
========================= */
function loadActiveDeliveries(){

const jobsContainer =
document.getElementById('jobsContainer');

const emptyState =
document.getElementById('emptyState');

jobsContainer.innerHTML = '';

activeJobs =
JSON.parse(localStorage.getItem('activeRiderJobs')) || [];

const riderActiveJobs =
activeJobs.filter(job => {

return (
job.riderId === currentRider?.riderId ||
job.riderId === currentRider?.id
);

});

if(riderActiveJobs.length === 0){

emptyState.style.display = 'block';
return;

}

emptyState.style.display = 'none';

riderActiveJobs
.sort((a,b)=>b.timestamp-a.timestamp)
.forEach(job=>{

jobsContainer.innerHTML += `

<div class="job-card">

<div class="job-top">

<div>

<div class="job-id">
${job.jobId || 'JOB-000'}
</div>

<div class="job-time">
<i class="fas fa-clock"></i>
Accepted:
${job.acceptedAt || ''}
</div>

</div>

<div class="badges">

<div class="tag ${job.jobType === 'Delivery' ? 'delivery' : 'pickup'}">
${job.jobType || 'Pickup'}
</div>

<div class="tag status-tag">
In Progress
</div>

</div>

</div>

<div class="flow-grid">

<!-- CUSTOMER -->
<div class="flow-box">

<div class="flow-head">

<i class="fas fa-user"></i>

<span>
Customer Information
</span>

</div>

<div class="info-row">
<strong>Name:</strong>
${job.customerName || 'N/A'}
</div>

<div class="info-row">
<strong>Phone:</strong>
${job.customerPhone || 'N/A'}
</div>

<div class="info-row">
<strong>Address:</strong>
${job.customerAddress || 'N/A'}
</div>

</div>

<!-- TECHNICIAN -->
<div class="flow-box">

<div class="flow-head">

<i class="fas fa-screwdriver-wrench"></i>

<span>
Technician Information
</span>

</div>

<div class="info-row">
<strong>Name:</strong>
${job.technicianName || 'N/A'}
</div>

<div class="info-row">
<strong>Phone:</strong>
${job.technicianPhone || 'N/A'}
</div>

<div class="info-row">
<strong>Address:</strong>
${job.technicianAddress || 'N/A'}
</div>

</div>

</div>

<div class="route-box">

<div class="route-step">

<div class="route-icon">
<i class="fas fa-location-dot"></i>
</div>

<div class="route-content">

<strong>
Pickup From
</strong>

${
job.jobType === 'Pickup'
? (job.customerAddress || 'N/A')
: (job.technicianAddress || 'N/A')
}

</div>

</div>

<div class="route-step">

<div class="route-icon">
<i class="fas fa-truck"></i>
</div>

<div class="route-content">

<strong>
Deliver To
</strong>

${
job.jobType === 'Pickup'
? (job.technicianAddress || 'N/A')
: (job.customerAddress || 'N/A')
}

</div>

</div>

</div>

<div class="actions">

<button
class="btn complete-btn"
onclick="openCompleteModal('${job.jobId}')">

Mark as Completed

</button>

</div>

</div>

`;

});

}

/* =========================
OPEN COMPLETE MODAL
========================= */
function openCompleteModal(jobId){

selectedJobId = jobId;

document
.getElementById('completeModal')
.style.display = 'flex';

}

/* =========================
CLOSE COMPLETE MODAL
========================= */
function closeCompleteModal(){

document
.getElementById('completeModal')
.style.display = 'none';

selectedJobId = null;

}

/* =========================
COMPLETE DELIVERY
========================= */
function confirmCompleteDelivery(){

if(!selectedJobId) return;

activeJobs =
JSON.parse(localStorage.getItem('activeRiderJobs')) || [];

deliveryHistory =
JSON.parse(localStorage.getItem('riderDeliveryHistory')) || [];

const selectedJob =
activeJobs.find(job =>
job.jobId === selectedJobId
);

if(selectedJob){

selectedJob.deliveryStatus = 'Completed';

selectedJob.completedAt =
new Date().toLocaleString('en-NG',{
dateStyle:'medium',
timeStyle:'short'
});

selectedJob.completedTimestamp =
Date.now();

deliveryHistory.unshift(selectedJob);

localStorage.setItem(
'riderDeliveryHistory',
JSON.stringify(deliveryHistory)
);

activeJobs =
activeJobs.filter(job =>
job.jobId !== selectedJobId
);

localStorage.setItem(
'activeRiderJobs',
JSON.stringify(activeJobs)
);

}

closeCompleteModal();

loadActiveDeliveries();

alert('Delivery marked as completed.');

}

/* =========================
CLOSE MODAL ON OUTSIDE CLICK
========================= */
window.onclick = function(e){

const completeModal =
document.getElementById('completeModal');

if(e.target === completeModal){
closeCompleteModal();
}

};

/* =========================
INIT
========================= */
loadActiveDeliveries();

</script>

</body>
</html>
