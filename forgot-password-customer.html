<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider - Forgot Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/forgot-password.css">
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="icon">
        <i class="fas fa-envelope"></i>
      </div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <form id="forgotForm">
      <label>Email Address</label>
      <input type="email" placeholder="Enter your registered email" required />

      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <div class="back-link">
      Remember your password? <a href="login-customer.html">Login</a>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/pages/forgot-password-customer.js"></script>

</body>
</html>
