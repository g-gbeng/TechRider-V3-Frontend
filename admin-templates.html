<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Admin Templates - TechRider
</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/admin-templates.css">
<script src="js/api.js" data-require-role="admin"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h1>
      Template Manager
    </h1>

    <button
      class="back-btn"
      onclick="goBack()"
    >

      <i class="fas fa-arrow-left"></i>
      Back

    </button>

  </div>

  <div class="grid">

    <!-- EMAIL -->
    <div class="section">

      <h2>
        Create Email Template
      </h2>

      <input
        id="emailTitle"
        placeholder="Template Title"
      >

      <input
        id="emailSubject"
        placeholder="Email Subject"
      >

      <textarea
        id="emailBody"
        placeholder="Email Body. Write {name} for the person's first name."
        maxlength="5000"
      ></textarea>

      <button
        class="primary-btn"
        onclick="saveEmailTemplate(this)"
      >
        Save Email Template
      </button>

    </div>

    <!-- NOTIFICATION -->
    <div class="section">

      <h2>
        Create Notification Template
      </h2>

      <input
        id="notifTitle"
        placeholder="Template Title"
      >

      <input
        id="notifSubject"
        placeholder="Notification Subject"
      >

      <textarea
        id="notifBody"
        placeholder="Notification Message. Write {name} for the person's first name."
        maxlength="1000"
      ></textarea>

      <button
        class="primary-btn"
        onclick="saveNotifTemplate(this)"
      >
        Save Notification Template
      </button>

    </div>

    <!-- SAVED EMAILS -->
    <div class="section">

      <h2>
        Saved Email Templates
      </h2>

      <div id="emailList"></div>

    </div>

    <!-- SAVED NOTIFICATIONS -->
    <div class="section">

      <h2>
        Saved Notification Templates
      </h2>

      <div id="notifList"></div>

    </div>

  </div>

</div>

<script src="js/pages/admin-templates.js"></script>

</body>
</html>
