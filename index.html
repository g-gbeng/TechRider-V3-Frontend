<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechRider</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/index.css">
</head>
<body>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
      <h1>Seamless Rides & Smart Repairs</h1>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

      <div class="welcome">
        <div class="brand-icon">
          <i class="fas fa-bolt"></i>
        </div>
        <div class="welcome-text">
          <h2>Welcome to TechRider</h2>
          <p>Select how you want to use the platform</p>
        </div>
      </div>

      <div class="options">

        <a href="signup-customer.html" class="option-card" id="customerOption">
          <i class="fas fa-user"></i>
          <div class="option-text">
            <h3>Customer</h3>
            <p>Book rides and request technicians easily</p>
          </div>
        </a>

        <a href="signup-technician.html" class="option-card" id="technicianOption">
          <i class="fas fa-tools"></i>
          <div class="option-text">
            <h3>Technician</h3>
            <p>Offer repair services and manage jobs</p>
          </div>
        </a>

        <a href="signup-rider.html" class="option-card" id="riderOption">
          <i class="fas fa-motorcycle"></i>
          <div class="option-text">
            <h3>Rider</h3>
            <p>Accept ride requests and earn</p>
          </div>
        </a>

      </div>

    </div>

  </div>

</body>
</html>
