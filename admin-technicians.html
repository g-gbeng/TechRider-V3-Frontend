<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TechRider - Technicians Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
}

body{
background:var(--gray);
display:flex;
min-height:100vh;
animation:fadeIn .45s ease;
}

/* Fade in */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Overlay */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
z-index:900;
}

.overlay.show{
display:block;
}

/* Sidebar */
.sidebar{
width:270px;
background:linear-gradient(180deg,var(--purple),var(--deep-purple));
color:white;
padding:20px;
position:fixed;
height:100vh;
overflow:auto;
transition:.3s;
z-index:1000;
}

.sidebar.collapsed{
width:72px;
}

.sidebar.collapsed .text{
display:none;
}

.brand{
display:flex;
align-items:center;
gap:12px;
margin-bottom:25px;
cursor:pointer;
}

.logo{
width:42px;
height:42px;
border-radius:12px;
background:var(--lilac);
color:var(--deep-purple);
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.nav{
display:flex;
flex-direction:column;
gap:10px;
}

.nav a{
text-decoration:none;
color:white;
padding:12px;
border-radius:12px;
display:flex;
align-items:center;
gap:12px;
}

.nav a.active,
.nav a:hover{
background:rgba(255,255,255,.14);
}

/* Main */
.main{
margin-left:270px;
width:calc(100% - 270px);
padding:20px;
}

.topbar{
background:white;
padding:16px 18px;
border-radius:16px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.hamburger{
display:none;
cursor:pointer;
font-size:1.2rem;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:var(--purple);
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* Metric Cards */
.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:20px;
}

.card{
background:white;
padding:22px;
border-radius:18px;
}

.metric{
font-size:2rem;
font-weight:700;
color:var(--purple);
margin-top:8px;
}

/* Toolbar */
.toolbar{
background:white;
padding:18px;
border-radius:18px;
display:flex;
gap:14px;
flex-wrap:wrap;
margin-bottom:20px;
}

.toolbar input,
.toolbar select{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
min-width:170px;
flex:1;
}

/* Table */
.tableWrap{
background:white;
border-radius:18px;
padding:20px;
overflow-x:auto;
}

table{
width:100%;
min-width:1000px;
border-collapse:collapse;
}

th,td{
padding:16px;
text-align:left;
border-bottom:1px solid #eee;
}

th{
color:var(--deep-purple);
}

.badge{
padding:7px 12px;
border-radius:20px;
font-size:.75rem;
font-weight:600;
display:inline-block;
}

.activeStat{
background:#e9d8fd;
color:var(--purple);
}

.suspendedStat{
background:#ffe5e5;
color:#b00020;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.btn{
border:none;
padding:9px 12px;
border-radius:10px;
font-weight:600;
cursor:pointer;
}

.btnGhost{
background:#f2ecff;
color:var(--purple);
}

.btnPrimary{
background:linear-gradient(
135deg,
var(--purple),
var(--lilac)
);
color:white;
}

/* Responsive */
@media(max-width:1100px){
.cards{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:768px){

.sidebar{
transform:translateX(-100%);
width:270px !important;
}

.sidebar.open{
transform:translateX(0);
}

.main{
margin-left:0;
width:100%;
}

.hamburger{
display:block;
}

.cards{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">

<div class="brand" onclick="toggleSidebar()">
<div class="logo">A</div>
<span class="text">Admin Panel</span>
</div>

<div class="nav">
<a href='admin-dashboard.html'><i class='fas fa-chart-line'></i><span class='text'>Dashboard</span></a>
<a href="admin-pending-approvals.html"><i class="fas fa-user-check"></i><span class="text">Pending Approvals</span></a>
<a href="admin-customers.html"><i class="fas fa-users"></i><span class="text">Customers</span></a>
<a href="admin-technicians.html"><i class="fas fa-screwdriver-wrench"></i><span class="text">Technicians</span></a>
<a href="admin-riders.html"><i class="fas fa-motorcycle"></i><span class="text">Riders</span></a>
<a href="admin-job-monitoring.html"><i class="fas fa-briefcase"></i><span class="text">Jobs Monitoring</span></a>
<a href="admin-communications.html"><i class="fas fa-envelope-open-text"></i><span class="text">Communications</span></a>
<a href="admin-reports.html"><i class="fas fa-file-lines"></i><span class="text">Reports</span></a>
<a href="admin-disputes.html"><i class="fas fa-gavel"></i><span class="text">Disputes</span></a>
<a href="admin-records.html"><i class="fas fa-id-card"></i><span class="text">Records</span></a>
<a href="admin-templates.html"><i class="fas fa-layer-group"></i><span class="text">Templates</span></a>
<a href="admin-login.html"><i class="fas fa-sign-out-alt"></i><span class="text">Logout</span></a>
</div></div>



<!-- Main -->
<div class="main">

<div class="topbar">
<div class="hamburger" id="hamburger">
<i class="fas fa-bars"></i>
</div>

<h3>Technician Management</h3>

<div class="avatar">A</div>
</div>


<!-- Metrics -->
<div class="cards">

<div class="card">
<h4>Total Technicians</h4>
<div class="metric" id="totalCount">0</div>
</div>

<div class="card">
<h4>Active Accounts</h4>
<div class="metric" id="activeCount">0</div>
</div>

<div class="card">
<h4>New This Week</h4>
<div class="metric" id="newCount">0</div>
</div>

<div class="card">
<h4>Suspended</h4>
<div class="metric" id="suspendedCount">0</div>
</div>

</div>


<!-- Filters -->
<div class="toolbar">

<input
id="searchBox"
placeholder="Search technician">

<select id="statusFilter">
<option value="all">All Statuses</option>
<option value="active">Active</option>
<option value="suspended">Suspended</option>
</select>

<select id="sortFilter">
<option value="newest">Newest Joined</option>
<option value="oldest">Oldest Joined</option>
<option value="jobs">Most Completed Jobs</option>
<option value="alpha">Alphabetical</option>
</select>

</div>


<!-- Table -->
<div class="tableWrap">

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Completed</th>
<th>Status</th>
<th>Joined</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="techTable"></tbody>

</table>
</div>

</div>


<script>

/* ===========================================================
   TECHNICIAN MANAGEMENT
   PART 1
=========================================================== */

/* -----------------------------
   STORAGE KEYS
------------------------------ */

const TECHNICIANS_KEY = "techrider_technicians";
const CURRENT_TECH_KEY = "techrider_current_technician";

/* -----------------------------
   DOM REFERENCES
------------------------------ */

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");

const hamburger =
document.getElementById("hamburger");

const techTable =
document.getElementById("techTable");

const searchBox =
document.getElementById("searchBox");

const statusFilter =
document.getElementById("statusFilter");

const sortFilter =
document.getElementById("sortFilter");

const totalCount =
document.getElementById("totalCount");

const activeCount =
document.getElementById("activeCount");

const suspendedCount =
document.getElementById("suspendedCount");

const newCount =
document.getElementById("newCount");

/* -----------------------------
   SIDEBAR
------------------------------ */

/*
Desktop:
expanded by default
click logo to collapse

Mobile:
hamburger opens
overlay closes
*/

function toggleSidebar(){

    if(window.innerWidth <= 768){

        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");

        return;

    }

    sidebar.classList.toggle("collapsed");

}

hamburger.addEventListener("click",toggleSidebar);

overlay.addEventListener("click",()=>{

    sidebar.classList.remove("open");

    overlay.classList.remove("show");

});

window.addEventListener("resize",()=>{

    if(window.innerWidth>768){

        sidebar.classList.remove("open");

        overlay.classList.remove("show");

    }

});

/* -----------------------------
   LOAD TECHNICIANS
------------------------------ */

function getTechnicians(){

    return JSON.parse(

        localStorage.getItem(
            TECHNICIANS_KEY
        )

    ) || [];

}

/* -----------------------------
   SAVE TECHNICIANS
------------------------------ */

function saveTechnicians(data){

    localStorage.setItem(

        TECHNICIANS_KEY,

        JSON.stringify(data)

    );

}

/* -----------------------------
   DATE FORMAT
------------------------------ */

function formatDate(date){

    if(!date)
        return "-";

    return new Date(date)

        .toLocaleDateString(

            "en-GB",

            {

                day:"2-digit",

                month:"short",

                year:"numeric"

            }

        );

}

/* -----------------------------
   NEW THIS WEEK
------------------------------ */

function isThisWeek(date){

    if(!date)
        return false;

    const today =
    new Date();

    const joined =
    new Date(date);

    const sevenDaysAgo =
    new Date();

    sevenDaysAgo.setDate(

        today.getDate()-7

    );

    return joined >= sevenDaysAgo;

}

/* -----------------------------
   METRICS
------------------------------ */

function updateMetrics(){

    const technicians =
    getTechnicians();

    totalCount.textContent =
    technicians.length;

    activeCount.textContent =

    technicians.filter(

        tech=>!tech.suspended

    ).length;

    suspendedCount.textContent =

    technicians.filter(

        tech=>tech.suspended

    ).length;

    newCount.textContent =

    technicians.filter(

        tech=>

        isThisWeek(

            tech.approvedAt ||

            tech.createdAt ||

            tech.submittedAt

        )

    ).length;

}

/* -----------------------------
   COMPLETED JOBS
------------------------------ */

function getCompletedJobs(technicianId){

    const requests =

    JSON.parse(

        localStorage.getItem(

            "techrider_requests"

        )

    ) || [];

    return requests.filter(request=>{

        return (

            request.assignedTechnician === technicianId &&

            request.status === "completed"

        );

    }).length;

}

/* ===========================================================
   TECHNICIAN MANAGEMENT
   PART 2
=========================================================== */

/* -----------------------------
   PROFILE
------------------------------ */

function openProfile(name){

    window.location.href =

        "admin-records.html?tech=" +

        encodeURIComponent(name);

}

/* -----------------------------
   SUSPEND / REACTIVATE
------------------------------ */

function toggleSuspend(technicianId){

    const technicians =
    getTechnicians();

    const technician =
    technicians.find(t=>

        String(t.id)===String(technicianId)

    );

    if(!technician){
        return;
    }

    /* -----------------------------
       CONFIRM ACTION
    ------------------------------ */

    const action = technician.suspended
        ? "reactivate"
        : "suspend";

    const confirmed = confirm(

        `Are you sure you want to ${action} ${technician.fullName}?`

    );

    if(!confirmed){
        return;
    }

    /* -----------------------------
       TOGGLE STATUS
    ------------------------------ */

    technician.suspended =
    !technician.suspended;

    saveTechnicians(technicians);

    /* -----------------------------
       UPDATE CURRENT SESSION
    ------------------------------ */

    const currentTech =
    JSON.parse(
        localStorage.getItem(
            CURRENT_TECH_KEY
        )
    );

    if(
        currentTech &&
        String(currentTech.id) ===
        String(technician.id)
    ){

        currentTech.suspended =
        technician.suspended;

        localStorage.setItem(
            CURRENT_TECH_KEY,
            JSON.stringify(currentTech)
        );

    }

    renderTable();

    updateMetrics();

    alert(

        technician.suspended
        ? `${technician.fullName} has been suspended successfully.`
        : `${technician.fullName} has been reactivated successfully.`

    );

}
/* -----------------------------
   TABLE
------------------------------ */

function renderTable(){

    techTable.innerHTML = "";

    const technicians =
    getTechnicians();

    technicians.forEach(tech=>{

        const row =
        document.createElement("tr");

        row.dataset.name =
        tech.fullName || "";

        row.dataset.status =

        tech.suspended ?

        "suspended"

        :

        "active";

        row.dataset.joined =

        tech.approvedAt ||

        tech.createdAt ||

        tech.submittedAt ||

        "";

        row.dataset.jobs =

        getCompletedJobs(

            tech.id

        );

        row.innerHTML = `

<td>

${tech.fullName || "-"}

</td>

<td>

${tech.email || "-"}

</td>

<td>

${getCompletedJobs(tech.id)}

</td>

<td>

<span class="badge ${

tech.suspended ?

"suspendedStat"

:

"activeStat"

}">

${

tech.suspended ?

"Suspended"

:

"Active"

}

</span>

</td>

<td>

${formatDate(

tech.approvedAt ||

tech.createdAt ||

tech.submittedAt

)}

</td>

<td>

<div class="actions">

<button
class="btn btnGhost">

Profile

</button>

<button
class="btn btnPrimary">

${

tech.suspended ?

"Reactivate"

:

"Suspend"

}

</button>

</div>

</td>

`;

        /* ------------------
           PROFILE
        ------------------- */

        row

        .querySelector(".btnGhost")

        .addEventListener(

            "click",

            ()=>{

                openProfile(

                    tech.fullName

                );

            }

        );

        /* ------------------
           SUSPEND
        ------------------- */

        row

        .querySelector(".btnPrimary")

        .addEventListener(

            "click",

            ()=>{

                toggleSuspend(

                    tech.id

                );

            }

        );

        techTable.appendChild(row);

    });

    updateMetrics();

}

/* ===========================================================
   TECHNICIAN MANAGEMENT
   PART 3
=========================================================== */

/* -----------------------------
   SEARCH + FILTER + SORT
------------------------------ */

function applyFiltersAndSort(){

    const query =
    searchBox.value
    .trim()
    .toLowerCase();

    const status =
    statusFilter.value;

    const sort =
    sortFilter.value;

    let rows =

    Array.from(

        techTable.querySelectorAll("tr")

    );

    /* -------------------------
       FILTER
    -------------------------- */

    rows.forEach(row=>{

        const matchesSearch =

            row.dataset.name
            .toLowerCase()
            .includes(query);

        const matchesStatus =

            status==="all" ||

            row.dataset.status===status;

        row.style.display =

            matchesSearch && matchesStatus

            ?

            "table-row"

            :

            "none";

    });

    /* -------------------------
       SORT
    -------------------------- */

    const visibleRows =

    rows.filter(

        row=>row.style.display!=="none"

    );

    visibleRows.sort((a,b)=>{

        switch(sort){

            case "newest":

                return new Date(b.dataset.joined)

                -

                new Date(a.dataset.joined);

            case "oldest":

                return new Date(a.dataset.joined)

                -

                new Date(b.dataset.joined);

            case "jobs":

                return Number(b.dataset.jobs)

                -

                Number(a.dataset.jobs);

            case "alpha":

                return a.dataset.name.localeCompare(

                    b.dataset.name

                );

            default:

                return 0;

        }

    });

    visibleRows.forEach(row=>{

        techTable.appendChild(row);

    });

}

/* -----------------------------
   EVENTS
------------------------------ */

searchBox.addEventListener(

    "input",

    applyFiltersAndSort

);

statusFilter.addEventListener(

    "change",

    applyFiltersAndSort

);

sortFilter.addEventListener(

    "change",

    applyFiltersAndSort

);

/* -----------------------------
   STORAGE LISTENER

   Keeps page live when
   another admin page changes
   technician data.
------------------------------ */

window.addEventListener(

    "storage",

    ()=>{

        renderTable();

        applyFiltersAndSort();

    }

);

/* -----------------------------
   INITIAL LOAD
------------------------------ */

renderTable();

applyFiltersAndSort();

console.log(

    "Technician Management Ready"

);


</script>

</body>
</html>
