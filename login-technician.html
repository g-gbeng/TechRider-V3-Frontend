<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechRider - Technician Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --white:#fff;
    }

    body{
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
      animation:fadeIn 0.6s ease-in;
    }

    .container{
      width:100%;
      max-width:400px;
      background:var(--white);
      padding:25px;
      border-radius:16px;
      box-shadow:0 15px 40px rgba(0,0,0,0.1);
    }

    .header{
      text-align:center;
      margin-bottom:20px;
    }

    .header p {
      color: #666;
      font-size: 0.9rem;
    }

    .logo{
      width:60px;
      height:60px;
      background:var(--lilac);
      color:var(--deep-purple);
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      margin:auto;
      font-size:1.4rem;
    }

    .header h2{
      margin-top:10px;
      color:var(--deep-purple);
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:#444;
    }

    input{
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:0.9rem;
    }

    .password-group{
      position:relative;
    }

    .toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#777;
    }

    .btn{
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .links{
      text-align:center;
      font-size:0.85rem;
      margin-top:10px;
    }

    .links a{
      color:var(--purple);
      text-decoration:none;
      font-weight:500;
    }

    .links.secondary{
      margin-top:5px;
    }

    .bottom-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
    }

    .bottom-link a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }


    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <i class="fas fa-user-cog"></i>
    </div>
    <h2>Technician Login</h2>
    <p>Welcome back to TechRider</p>
  </div>

  <form class="form" id="loginForm">

    <div class="group">
      <label>Email Address</label>
      <input type="email" required>
    </div>

    <div class="group password-group">
      <label>Password</label>
      <input type="password" id="password" required>
      <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
    </div>

    <button class="btn" type="submit">Login</button>

    <div class="links">
      <a href="forgot-password-technician.html">Forgot Password?</a>
    </div>
 <div class="links secondary">
      Don’t have an account?
      <a href="signup-technician.html">Sign up</a>
    </div>

  </form>

    <div class="bottom-link">
      Secure access for TechRider technicians
    </div>

</div>

<script>

function togglePassword(icon){
  const input = icon.previousElementSibling;

  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

/* LOGIN LOGIC */
document.getElementById("loginForm").addEventListener("submit", function(e){

  e.preventDefault();

  const email =
    document.querySelector('input[type="email"]').value.trim();

  const password =
    document.getElementById("password").value.trim();

  const technicians =
    JSON.parse(localStorage.getItem("techrider_technicians")) || [];

  if(technicians.length === 0){
    alert("No registered technicians found. Please sign up first.");
    return;
  }

  const foundTech = technicians.find(
    tech =>
      tech.email === email &&
      tech.password === password
  );

  if(!foundTech){
    alert("Invalid email or password");
    return;
  }

  /* STORE SESSION */
  localStorage.setItem(
    "techrider_current_technician",
    JSON.stringify(foundTech)
  );

  alert("Login successful");

  window.location.href = "awaiting-approval-technician.html";

});

</script>
</body>
</html>
