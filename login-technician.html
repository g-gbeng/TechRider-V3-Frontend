<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechRider - Technician Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --purple:#5a189a;
      --deep-purple:#240046;
      --lilac:#e0aaff;
      --white:#fff;
    }

    body{
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
      animation:fadeIn 0.6s ease-in;
    }

    .container{
      width:100%;
      max-width:400px;
      background:var(--white);
      padding:25px;
      border-radius:16px;
      box-shadow:0 15px 40px rgba(0,0,0,0.1);
    }

    .header{
      text-align:center;
      margin-bottom:20px;
    }

    .header p {
      color: #666;
      font-size: 0.9rem;
    }

    .logo{
      width:60px;
      height:60px;
      background:var(--lilac);
      color:var(--deep-purple);
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      margin:auto;
      font-size:1.4rem;
    }

    .header h2{
      margin-top:10px;
      color:var(--deep-purple);
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:0.85rem;
      color:#444;
    }

    input{
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:0.9rem;
    }

    .password-group{
      position:relative;
    }

    .toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#777;
    }

    .btn{
      margin-top:10px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--lilac));
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .links{
      text-align:center;
      font-size:0.85rem;
      margin-top:10px;
    }

    .links a{
      color:var(--purple);
      text-decoration:none;
      font-weight:500;
    }

    .links.secondary{
      margin-top:5px;
    }

    .bottom-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
    }

    .bottom-link a {
      color: var(--purple);
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-link a:hover {
      text-decoration: underline;
    }


    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }

    /* ===============================
      LOGIN MESSAGE
=============================== */

.login-message{

    display:none;

    margin-top:12px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:.9rem;

    font-weight:500;

}

.login-message.success{

    display:block;

    background:#dcfce7;

    color:#166534;

}

.login-message.error{

    display:block;

    background:#fee2e2;

    color:#b91c1c;

}

.login-message.pending{

    display:block;

    background:#fef3c7;

    color:#92400e;

}
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <i class="fas fa-user-cog"></i>
    </div>
    <h2>Technician Login</h2>
    <p>Welcome back to TechRider</p>
  </div>

  <form class="form" id="loginForm">

    <div class="group">
      <label>Email Address</label>
      <input
    type="email"
    id="email"
    required
>
    </div>

    <div class="group password-group">
      <label>Password</label>
      <input type="password" id="password" required>
      <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
    </div>

    <button class="btn" type="submit">Login</button>

    <div id="loginMessage" class="login-message"></div>

    <div class="links">
      <a href="forgot-password-technician.html">Forgot Password?</a>
    </div>
 <div class="links secondary">
      Don’t have an account?
      <a href="signup-technician.html">Sign up</a>
    </div>

  </form>

    <div class="bottom-link">
      Secure access for TechRider technicians
    </div>

</div>

<script>

/* ==========================================================
   TECHRIDER TECHNICIAN LOGIN
   PART 1
========================================================== */

/* ==============================
    STORAGE KEYS
============================== */

const APPROVED_KEY = "techrider_technicians";
const PENDING_KEY = "techrider_pending_registrations";
const CURRENT_KEY = "techrider_current_technician";

/* ==============================
    DOM
============================== */

const loginForm = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginMessage = document.getElementById("loginMessage");

/* ==============================
    PASSWORD TOGGLE
============================== */

function togglePassword(icon){

    const input = icon.previousElementSibling;

    if(input.type==="password"){

        input.type="text";

        icon.classList.replace(

            "fa-eye",

            "fa-eye-slash"

        );

    }

    else{

        input.type="password";

        icon.classList.replace(

            "fa-eye-slash",

            "fa-eye"

        );

    }

}

/* ==============================
    STORAGE HELPERS
============================== */

function getApprovedTechnicians(){

    return JSON.parse(

        localStorage.getItem(APPROVED_KEY)

    ) || [];

}

function getPendingApplicants(){

    return JSON.parse(

        localStorage.getItem(PENDING_KEY)

    ) || [];

}

/* ==============================
    MESSAGE BOX
============================== */

function showMessage(type,message){

    loginMessage.className =

        "login-message " + type;

    loginMessage.textContent = message;

}

function clearMessage(){

    loginMessage.className =

        "login-message";

    loginMessage.textContent = "";

}

/* ==============================
    SESSION
============================== */

function saveCurrentTechnician(user){

    localStorage.setItem(

        CURRENT_KEY,

        JSON.stringify(user)

    );

}

/* ==============================
    LOGIN
============================== */

loginForm.addEventListener(

    "submit",

    function(e){

        e.preventDefault();

        clearMessage();

        const email =

            emailInput.value

            .trim()

            .toLowerCase();

        const password =

            passwordInput.value.trim();

        const approved =

            getApprovedTechnicians();

        const pending =

            getPendingApplicants();

        const approvedUser =

            approved.find(user=>

                user.email.toLowerCase()===email

            );

        if(approvedUser){

            if(approvedUser.password!==password){

                showMessage(

                    "error",

                    "Incorrect password."

                );

                return;

            }

            saveCurrentTechnician(

                approvedUser

            );

            showMessage(

                "success",

                "Login successful. Redirecting..."

            );

            setTimeout(()=>{

                window.location.href =

                "dashboard-technician.html";

            },1200);

            return;

        }

                /* =================================
            CHECK PENDING APPROVALS
        ================================= */

        const pendingUser = pending.find(user=>

            (user.email || "").toLowerCase()===email &&

            user.userType==="Technician"

        );

        if(pendingUser){

            showMessage(

                "pending",

                "Your account is awaiting administrator approval. Please try again later."

            );

            return;

        }

        /* =================================
            EMAIL DOES NOT EXIST
        ================================= */

        showMessage(

            "error",

            "No technician account was found with this email."

        );

    }

);

/* =================================
    CLEAR MESSAGE WHILE TYPING
================================= */

emailInput.addEventListener(

    "input",

    clearMessage

);

passwordInput.addEventListener(

    "input",

    clearMessage

);

/* =================================
    ENTER KEY SUPPORT
================================= */

document.addEventListener(

    "keydown",

    function(e){

        if(

            e.key==="Enter" &&

            document.activeElement===passwordInput

        ){

            loginForm.requestSubmit();

        }

    }

);


</script>
</body>
</html>
