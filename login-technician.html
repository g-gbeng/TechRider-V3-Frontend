<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechRider - Technician Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/login-technician.css">
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <i class="fas fa-user-cog"></i>
    </div>
    <h2>Technician Login</h2>
    <p>Welcome back to TechRider</p>
  </div>

  <form class="form" id="loginForm">

    <div class="group">
      <label for="email">Email Address</label>
      <input
    type="email"
    id="email"
    required
>
    </div>

    <div class="group password-group">
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <i class="fas fa-eye toggle" onclick="togglePassword(this)"></i>
    </div>

    <button class="btn" type="submit">Login</button>

    <div id="loginMessage" class="login-message"></div>

    <div class="links">
      <a href="forgot-password.html?role=technician">Forgot Password?</a>
    </div>
 <div class="links secondary">
      Don’t have an account?
      <a href="signup-technician.html">Sign up</a>
    </div>

  </form>

    <div class="bottom-link">
      Secure access for TechRider technicians
    </div>

</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login-technician.js"></script>
</body>
</html>
