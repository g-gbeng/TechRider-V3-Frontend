<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rider Sign Up - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--white:#fff;
}

body{
background:linear-gradient(135deg,var(--purple),var(--lilac));
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
animation:fadeIn .5s ease-in;
}

.container{
background:var(--white);
max-width:520px;
width:100%;
padding:32px;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.header{
text-align:center;
margin-bottom:22px;
}

.icon{
width:68px;
height:68px;
margin:auto;
border-radius:18px;
background:linear-gradient(135deg,var(--purple),var(--deep-purple));
display:flex;
align-items:center;
justify-content:center;
font-size:1.6rem;
color:white;
}

.header h2{
margin-top:15px;
color:var(--deep-purple);
}

.header p{
font-size:.88rem;
color:#666;
margin-top:6px;
}

.login-wrap{
text-align:center;
margin-bottom:18px;
font-size:.85rem;
color:#000;
}

.login-wrap a{
color:var(--purple);
text-decoration:none;
font-weight:500;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:6px;
font-size:.86rem;
font-weight:500;
color:#333;
}

input,
select{
width:100%;
padding:13px 14px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
font-size:.95rem;
}

input:focus,
select:focus{
border-color:var(--purple);
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:48px;
}

.toggle{
position:absolute;
top:50%;
right:15px;
transform:translateY(-50%);
cursor:pointer;
color:#666;
}

.filebox{
padding:12px;
border:1px dashed #bbb;
border-radius:12px;
background:#fafafa;
}

small{
display:block;
margin-top:6px;
color:#777;
font-size:.72rem;
}

button{
width:100%;
border:none;
padding:14px;
border-radius:12px;
background:linear-gradient(135deg,var(--purple),var(--lilac));
color:white;
font-weight:600;
cursor:pointer;
margin-top:8px;
}

.legal{
margin-top:18px;
text-align:center;
font-size:.8rem;
}

.legal a{
text-decoration:none;
color:var(--purple);
margin:0 6px;
}

@media(max-width:540px){
.container{
padding:22px;
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="icon">
<i class="fas fa-motorcycle"></i>
</div>

<h2>Create Rider Account</h2>
<p>Register to begin accepting TechRider jobs</p>
</div>

<div class="login-wrap">
Already have an account?
<a href="login-rider.html">Log in</a>
</div>

<form action="login-rider.html" id="signupForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Address</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Plate Number</label>
<input
type="text"
placeholder="e.g LND-458XY"
required>
</div>

<div class="form-group">
<label>Vehicle Type</label>
<select required>
<option value="">Select vehicle</option>
<option>Motorcycle</option>
<option>Scooter</option>
<option>Car</option>
<option>Van</option>
</select>
</div>

<div class="form-group">
<label>Driver's License Upload</label>
<div class="filebox">
<input
type="file"
name="drivers_license"
accept="image/*"
required>
</div>
<small>Will later upload to Cloudinary</small>
</div>

<div class="form-group">
<label>Facial Image Upload</label>
<div class="filebox">
<input
type="file"
name="facial_image"
accept="image/*"
required>
</div>
<small>Will later upload to Cloudinary</small>
</div>

<!-- PASSWORD -->
<div class="form-group">
<label>Password</label>

<div class="password-wrap">
<input
type="password"
id="pass1"
pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$"
required
oninvalid="this.setCustomValidity('Password must contain at least 8 characters, including one uppercase letter, one number, and one special character.')"
oninput="this.setCustomValidity('')"
>

<i class="fas fa-eye toggle"
onclick="togglePassword('pass1',this)">
</i>

</div>
</div>

<!-- CONFIRM PASSWORD -->
<div class="form-group">
<label>Confirm Password</label>

<div class="password-wrap">
<input
type="password"
id="pass2"
required
oninput="validateMatch()"
>

<i class="fas fa-eye toggle"
onclick="togglePassword('pass2',this)">
</i>

</div>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="legal">
<a href="terms-of-service-rider.html">Terms of Service</a> |
<a href="privacy-policy-rider.html">Privacy Policy</a>
</div>

</div>

<script>
function togglePassword(id,icon){
const field=document.getElementById(id);

if(field.type==="password"){
field.type="text";
icon.classList.replace("fa-eye","fa-eye-slash");
}else{
field.type="password";
icon.classList.replace("fa-eye-slash","fa-eye");
}
}

/* Confirm Password Match Check */
function validateMatch(){
const pass1=document.getElementById("pass1");
const pass2=document.getElementById("pass2");

if(pass2.value !== pass1.value){
pass2.setCustomValidity(
"Passwords do not match."
);
}else{
pass2.setCustomValidity("");
}
}
</script>

</body>
</html>
