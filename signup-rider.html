<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rider Sign Up - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--white:#fff;
}

body{
background:linear-gradient(135deg,var(--purple),var(--lilac));
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
animation:fadeIn .5s ease-in;
}

.container{
background:var(--white);
max-width:520px;
width:100%;
padding:32px;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.header{
text-align:center;
margin-bottom:22px;
}

.icon{
width:68px;
height:68px;
margin:auto;
border-radius:18px;
background:linear-gradient(135deg,var(--purple),var(--deep-purple));
display:flex;
align-items:center;
justify-content:center;
font-size:1.6rem;
color:white;
}

.header h2{
margin-top:15px;
color:var(--deep-purple);
}

.header p{
font-size:.88rem;
color:#666;
margin-top:6px;
}

.login-wrap{
text-align:center;
margin-bottom:18px;
font-size:.85rem;
color:#000;
}

.login-wrap a{
color:var(--purple);
text-decoration:none;
font-weight:500;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:6px;
font-size:.86rem;
font-weight:500;
color:#333;
}

input,
select{
width:100%;
padding:13px 14px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
font-size:.95rem;
}

input:focus,
select:focus{
border-color:var(--purple);
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:48px;
}

.toggle{
position:absolute;
top:50%;
right:15px;
transform:translateY(-50%);
cursor:pointer;
color:#666;
}

.filebox{
padding:12px;
border:1px dashed #bbb;
border-radius:12px;
background:#fafafa;
}

.file-info{
margin-top:8px;
font-size:.78rem;
color:#666;
line-height:1.5;
}

.file-success{
color:#16a34a;
font-weight:500;
}

small{
display:block;
margin-top:6px;
color:#777;
font-size:.72rem;
}

button{
width:100%;
border:none;
padding:14px;
border-radius:12px;
background:linear-gradient(135deg,var(--purple),var(--lilac));
color:white;
font-weight:600;
cursor:pointer;
margin-top:8px;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.7;
cursor:not-allowed;
transform:none;
}

.legal{
margin-top:18px;
text-align:center;
font-size:.8rem;
}

.legal a{
text-decoration:none;
color:var(--purple);
margin:0 6px;
}

@media(max-width:540px){

.container{
padding:22px;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(12px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="icon">
<i class="fas fa-motorcycle"></i>
</div>

<h2>Create Rider Account</h2>

<p>
Register to begin accepting TechRider jobs
</p>

</div>

<div class="login-wrap">

Already have an account?

<a href="login-rider.html">
Log in
</a>

</div>

<form id="signupForm">

<!-- FULL NAME -->
<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
id="fullName"
required
>

</div>

<!-- EMAIL -->
<div class="form-group">

<label>
Email Address
</label>

<input
type="email"
id="email"
required
>

</div>

<!-- PHONE -->
<div class="form-group">

<label>
Phone Number
</label>

<input
type="tel"
id="phone"
maxlength="11"
inputmode="numeric"
pattern="[0-9]{11}"
placeholder="Enter 11-digit phone number"
required
>

</div>

<!-- ADDRESS -->
<div class="form-group">

<label>
Address
</label>

<input
type="text"
id="address"
required
>

</div>

<!-- PLATE NUMBER -->
<div class="form-group">

<label>
Plate Number
</label>

<input
type="text"
id="plateNumber"
placeholder="e.g LND-458XY"
required
>

</div>

<!-- VEHICLE TYPE -->
<div class="form-group">

<label>
Vehicle Type
</label>

<select
id="vehicleType"
required
>

<option value="">
Select vehicle
</option>

<option>
Motorcycle
</option>

<option>
Car
</option>

<option>
Van
</option>

</select>

</div>

<!-- LICENSE -->
<div class="form-group">

<label>
Driver's License Upload
</label>

<div class="filebox">

<input
type="file"
id="driversLicense"
accept="image/*"
required
>

<div
class="file-info"
id="licenseInfo"
>

Maximum size: 2MB

</div>

</div>

<small>
Upload clear image of driver's license
</small>

</div>

<!-- FACIAL IMAGE -->
<div class="form-group">

<label>
Facial Image Upload
</label>

<div class="filebox">

<input
type="file"
id="facialImage"
accept="image/*"
required
>

<div
class="file-info"
id="facialInfo"
>

Maximum size: 2MB

</div>

</div>

<small>
Upload clear facial photograph
</small>

</div>

<!-- PASSWORD -->
<div class="form-group">

<label>
Password
</label>

<div class="password-wrap">

<input
type="password"
id="pass1"
pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$"
required
oninvalid="this.setCustomValidity('Password must contain at least 8 characters, including one uppercase letter, one number, and one special character.')"
oninput="this.setCustomValidity('')"
>

<i
class="fas fa-eye toggle"
onclick="togglePassword('pass1',this)"
></i>

</div>

</div>

<!-- CONFIRM PASSWORD -->
<div class="form-group">

<label>
Confirm Password
</label>

<div class="password-wrap">

<input
type="password"
id="pass2"
required
oninput="validateMatch()"
>

<i
class="fas fa-eye toggle"
onclick="togglePassword('pass2',this)"
></i>

</div>

</div>

<button
type="submit"
id="submitBtn"
>

Create Account

</button>

</form>

<div class="legal">

<a href="terms-of-service-rider.html">
Terms of Service
</a>

|

<a href="privacy-policy-rider.html">
Privacy Policy
</a>

</div>

</div>

<script>

/* =========================
TOGGLE PASSWORD
========================= */

function togglePassword(id,icon){

const field =
document.getElementById(id);

if(field.type==="password"){

field.type="text";

icon.classList.replace(
"fa-eye",
"fa-eye-slash"
);

}else{

field.type="password";

icon.classList.replace(
"fa-eye-slash",
"fa-eye"
);

}

}

/* =========================
CONFIRM PASSWORD
========================= */

function validateMatch(){

const pass1 =
document.getElementById("pass1");

const pass2 =
document.getElementById("pass2");

if(pass2.value !== pass1.value){

pass2.setCustomValidity(
"Passwords do not match."
);

}else{

pass2.setCustomValidity("");

}

}

/* =========================
PHONE NUMBER LIMIT
========================= */

document.getElementById(
"phone"
).addEventListener("input", function(){

this.value =
this.value
.replace(/\D/g,'')
.slice(0,11);

});

/* =========================
MAX IMAGE SIZE
========================= */

const MAX_IMAGE_SIZE =
2 * 1024 * 1024;

/* =========================
VALIDATE IMAGE
========================= */

function validateImage(file,infoId){

const info =
document.getElementById(infoId);

if(!file){

info.innerHTML =
'Maximum size: 2MB';

return false;

}

if(file.size > MAX_IMAGE_SIZE){

info.innerHTML =
'❌ File too large. Please upload image below 2MB';

info.style.color = '#dc2626';

return false;

}

info.innerHTML =
`✅ ${file.name}`;

info.classList.add(
'file-success'
);

return true;

}

/* =========================
IMAGE PREVIEW VALIDATION
========================= */

document.getElementById(
'driversLicense'
).addEventListener(
'change',
function(){

validateImage(
this.files[0],
'licenseInfo'
);

}
);

document.getElementById(
'facialImage'
).addEventListener(
'change',
function(){

validateImage(
this.files[0],
'facialInfo'
);

}
);

/* =========================
COMPRESS IMAGE
========================= */

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader =
new FileReader();

reader.readAsDataURL(file);

reader.onload = event => {

const img =
new Image();

img.src =
event.target.result;

img.onload = () => {

const canvas =
document.createElement('canvas');

const ctx =
canvas.getContext('2d');

let width =
img.width;

let height =
img.height;

const maxWidth = 800;
const maxHeight = 800;

/* RESIZE */

if(width > height){

if(width > maxWidth){

height *=
maxWidth / width;

width = maxWidth;

}

}else{

if(height > maxHeight){

width *=
maxHeight / height;

height = maxHeight;

}

}

canvas.width = width;
canvas.height = height;

ctx.drawImage(
img,
0,
0,
width,
height
);

/* COMPRESS */

const compressedBase64 =
canvas.toDataURL(
'image/jpeg',
0.6
);

resolve(
compressedBase64
);

};

};

reader.onerror =
error => reject(error);

});

}

/* =========================
GENERATE RIDER ID
========================= */

function generateRiderId(){

return "RID-" + Date.now();

}

/* =========================
SIGNUP FORM
========================= */

document.getElementById(
"signupForm"
).addEventListener(
"submit",
async function(e){

e.preventDefault();

const submitBtn =
document.getElementById(
'submitBtn'
);

submitBtn.disabled = true;
submitBtn.innerHTML =
'Creating Account...';

/* PASSWORD MATCH */

validateMatch();

const pass1 =
document.getElementById("pass1").value;

const pass2 =
document.getElementById("pass2").value;

if(pass1 !== pass2){

alert("Passwords do not match");

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

return;

}

/* PHONE VALIDATION */

const phone =
document.getElementById("phone").value;

if(phone.length !== 11){

alert(
"Phone number must be exactly 11 digits"
);

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

return;

}

/* FILES */

const licenseFile =
document.getElementById(
"driversLicense"
).files[0];

const facialFile =
document.getElementById(
"facialImage"
).files[0];

if(!licenseFile || !facialFile){

alert(
"Please upload required images"
);

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

return;

}

/* SIZE CHECK */

if(
licenseFile.size > MAX_IMAGE_SIZE
||
facialFile.size > MAX_IMAGE_SIZE
){

alert(
'Images must be below 2MB'
);

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

return;

}

try{

/* COMPRESS IMAGES */

const driversLicenseImage =
await compressImage(
licenseFile
);

const facialImage =
await compressImage(
facialFile
);

/* RIDERS STORAGE */

const riders =
JSON.parse(
localStorage.getItem(
"techrider_riders"
)
) || [];

/* EMAIL CHECK */

const email =
document.getElementById(
"email"
).value.trim();

const existingRider =
riders.find(rider =>

rider.email.toLowerCase() ===
email.toLowerCase()

);

if(existingRider){

alert(
"An account with this email already exists"
);

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

return;

}

/* GENERATE ID */

const riderId =
generateRiderId();

/* RIDER DATA */

const riderData = {

id: riderId,

riderId: riderId,

fullName:
document.getElementById(
"fullName"
).value.trim(),

email,

phone,

address:
document.getElementById(
"address"
).value.trim(),

plateNumber:
document.getElementById(
"plateNumber"
).value.trim(),

vehicleType:
document.getElementById(
"vehicleType"
).value,

password: pass1,

driversLicenseImage,

facialImage,

verified:false,

status:"active",

userType:"rider",

createdAt:
new Date().toISOString()

};

/* SAVE RIDER */

riders.unshift(riderData);

localStorage.setItem(
"techrider_riders",
JSON.stringify(riders)
);

/* SAVE CURRENT RIDER */

localStorage.setItem(
"techrider_current_rider",
JSON.stringify(riderData)
);

/* OPTIONAL GENERIC CURRENT USER */

localStorage.setItem(
"currentUser",
JSON.stringify(riderData)
);

/* SUCCESS */

alert(
"Rider account created successfully"
);

/* REDIRECT */

window.location.href =
"login-rider.html";

}catch(error){

console.error(error);

alert(
'Signup failed. Please try smaller images.'
);

submitBtn.disabled = false;
submitBtn.innerHTML =
'Create Account';

}

});

</script>

</body>
</html>
