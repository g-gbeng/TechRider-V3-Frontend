<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>
<title>Select Technician - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/select-technician.css">
<script src="js/api.js" data-require-role="customer"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Select Technician</h2>

    <a class="back-btn" href="repair-request.html">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>

  <div class="tech-grid" id="techGrid"></div>

  <div class="empty" id="emptyState"></div>

  <div class="submit-wrapper">
    <button
      class="submit-btn"
      id="submitBtn"
      disabled
    >
      Submit Request
    </button>
  </div>

</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">

  <div class="modal-card">

    <div class="modal-icon">
      <i class="fas fa-paper-plane"></i>
    </div>

    <h3>Repair Request Sent</h3>

    <p>
      TechRider will notify you when your device has been reviewed by the selected technician and a repair quote will be sent to your notification inbox.
    </p>

    <button class="close-btn" id="closeModalBtn">
      Close
    </button>

  </div>

</div>

<script src="js/pages/select-technician.js"></script>

</body>
</html>
