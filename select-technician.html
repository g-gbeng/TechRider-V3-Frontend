<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Select Technician - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{
  --purple:#5a189a;
  --deep-purple:#240046;
  --lilac:#e0aaff;
  --gray:#f6f6f6;
  --white:#fff;
}

body{
  background:var(--gray);
  padding:20px;
  display:flex;
  justify-content:center;
  min-height:100vh;
  animation:fadeIn .6s ease;
}

.container{
  width:100%;
  max-width:900px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:12px;
}

.header h2{
  color:var(--deep-purple);
}

.back-btn{
  background:var(--purple);
  color:white;
  padding:10px 14px;
  border-radius:10px;
  text-decoration:none;
  font-size:.85rem;
}

/* GRID */
.tech-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-bottom:25px;
}

/* CARD */
.tech-card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
  display:flex;
  gap:15px;
  align-items:center;
  cursor:pointer;
  transition:.3s;
  border:2px solid transparent;
}

.tech-card:hover{
  transform:translateY(-3px);
  border-color:var(--purple);
}

.tech-card.active{
  border-color:var(--purple);
  background:#faf5ff;
}

/* AVATAR */
.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--lilac);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  color:var(--deep-purple);
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* INFO */
.info{
  flex:1;
  min-width:0;
}

.name{
  font-weight:600;
  color:var(--deep-purple);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  color:#1dbf73;
  font-size:.85rem;
}

.specialization{
  font-size:.85rem;
  color:#666;
  margin-top:4px;
}

.location{
  margin-top:6px;
  font-size:.82rem;
  color:var(--purple);
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
}

/* SUBMIT BUTTON */
.submit-wrapper{
  display:flex;
  justify-content:center;
}

.submit-btn{
  width:100%;
  max-width:350px;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--lilac));
  color:white;
  font-weight:600;
  cursor:pointer;
  font-size:1rem;
  transition:.3s;
}

.submit-btn:hover{
  transform:translateY(-2px);
}

.submit-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

/* EMPTY STATE */
.empty{
  text-align:center;
  padding:40px;
  background:white;
  border-radius:16px;
  display:none;
}

.empty i{
  font-size:2.5rem;
  color:var(--purple);
  margin-bottom:10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-card{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:22px;
  padding:28px;
  text-align:center;
  animation:fadeIn .4s ease;
}

.modal-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#f3e8ff;
  color:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.8rem;
  margin:0 auto 18px;
}

.modal-card h3{
  color:var(--deep-purple);
  margin-bottom:12px;
}

.modal-card p{
  color:#555;
  line-height:1.8;
  font-size:.95rem;
}

.close-btn{
  margin-top:22px;
  border:none;
  background:linear-gradient(135deg,var(--purple),var(--lilac));
  color:white;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
}

/* RESPONSIVE */
@media(max-width:768px){

  .tech-grid{
    grid-template-columns:1fr;
  }

  .submit-btn{
    max-width:100%;
  }

}

/* FADE IN */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Select Technician</h2>

    <a class="back-btn" href="repair-request.html">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>

  <div class="tech-grid" id="techGrid"></div>

  <div class="empty" id="emptyState">
    <i class="fas fa-user-slash"></i>
    <p>No technicians available</p>
  </div>

  <div class="submit-wrapper">
    <button
      class="submit-btn"
      id="submitBtn"
      disabled
    >
      Submit Request
    </button>
  </div>

</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">

  <div class="modal-card">

    <div class="modal-icon">
      <i class="fas fa-paper-plane"></i>
    </div>

    <h3>Repair Request Sent</h3>

    <p>
      TechRider will notify you when your device has been reviewed by the selected technician and a repair quote will be sent to your notification inbox.
    </p>

    <button class="close-btn" id="closeModalBtn">
      Close
    </button>

  </div>

</div>

<script>

const techGrid = document.getElementById("techGrid");
const emptyState = document.getElementById("emptyState");
const submitBtn = document.getElementById("submitBtn");

let selectedTechnician = null;

/* =========================
   FETCH TECHNICIANS
========================= */

const rawTechnicians =
  JSON.parse(localStorage.getItem("techrider_technicians")) || [];

const technicians = rawTechnicians.map(t => ({
  id: t.id || t.technicianId,
  fullName: t.fullName,
  specialization: t.specialization,
  location: t.address || t.location,
  profileImage: t.profileImage,
  verified: t.verified
}));
/* =========================
   FETCH PENDING REQUEST
========================= */

const pendingRequest =
  JSON.parse(localStorage.getItem("techrider_pending_request"));

if(!pendingRequest){
  window.location.href = "repair-request.html";
}

/* =========================
   INITIALS
========================= */

function getInitials(name){

  if(!name) return "T";

  return name
    .split(" ")
    .map(n => n[0])
    .join("")
    .toUpperCase();

}

/* =========================
   RENDER TECHS
========================= */

function renderTechnicians(){

  if(technicians.length === 0){
    emptyState.style.display = "block";
    return;
  }

  technicians.forEach(tech => {

    const card = document.createElement("div");

    card.className = "tech-card";

    card.innerHTML = `
      <div class="avatar">
        ${
          tech.profileImage
            ? `<img src="${tech.profileImage}" alt="tech"/>`
            : getInitials(tech.fullName)
        }
      </div>

      <div class="info">

        <div class="name">

          ${tech.fullName || "Unnamed Technician"}

          ${
            tech.verified
              ? `<i class="fas fa-check-circle badge"></i>`
              : ""
          }

        </div>

        <div class="specialization">
          ${tech.specialization || "General Technician"}
        </div>

        <div class="location">
          <i class="fas fa-location-dot"></i>
           ${tech.location || "Location unavailable"}
        </div>

      </div>
    `;

    /* SELECT TECHNICIAN */

    card.addEventListener("click", () => {

      document
        .querySelectorAll(".tech-card")
        .forEach(c => c.classList.remove("active"));

      card.classList.add("active");

      selectedTechnician = tech;

      submitBtn.disabled = false;

    });

    techGrid.appendChild(card);

  });

}

/* =========================
   SUBMIT REQUEST
========================= */

submitBtn.addEventListener("click", () => {

  if(!selectedTechnician) return;

  const requests =
    JSON.parse(
      localStorage.getItem(
        "techrider_requests"
      )
    ) || [];

const currentCustomer =
JSON.parse(
localStorage.getItem(
"techrider_current_customer"
)
) || {};

  const repairRequest = {

    ...pendingRequest,

    assignedTechnician:
      selectedTechnician.id,

    technicianName:
      selectedTechnician.fullName,

    technicianSpecialization:
      selectedTechnician.specialization,

    technicianExperience:
      selectedTechnician.yearsExperience,

    customerId:
      currentCustomer.customerId ||
      currentCustomer.id,

    customerName:
      currentCustomer.fullName ||
      currentCustomer.name,

    status:"pending",

    createdAt:
      new Date().toISOString(),

    requestId:
      "REQ-" + Date.now()

  };

  /* =========================
     SAVE REQUEST
  ========================= */

  const requestIndex =
requests.findIndex(
r => r.id === pendingRequest.id
);

if(requestIndex !== -1){

requests[requestIndex] = repairRequest;

}else{

requests.unshift(repairRequest);

}

localStorage.setItem(
"techrider_requests",
JSON.stringify(requests)
);

  /* =========================
     TECHNICIAN AVAILABLE JOBS
  ========================= */

  const technicianJobs =
    JSON.parse(
      localStorage.getItem(
        `tech_jobs_${selectedTechnician.id}`
      )
    ) || [];

  technicianJobs.unshift(repairRequest);

  localStorage.setItem(
    `tech_jobs_${selectedTechnician.id}`,
    JSON.stringify(technicianJobs)
  );

  /* =========================
     SEND TECHNICIAN NOTIFICATION
  ========================= */

  const allNotifications =
    JSON.parse(
      localStorage.getItem(
        "techrider_notifications"
      )
    ) || [];

  const technicianNotification = {

    id:
      "NOTIF-" + Date.now(),

    userType:
      "technician",

    userId:
      selectedTechnician.id,

    recipientId:
      selectedTechnician.id,

    targetId:
      selectedTechnician.id,

    type:
      "job",

    title:
      "New Repair Job Available",

    message:
      "New repair job available, visit available jobs page to view.",

    customerName:
      currentCustomer.fullName ||
      currentCustomer.name,

    requestId:
      repairRequest.requestId,

    read:false,

    createdAt:
      new Date().toISOString()

  };

  allNotifications.unshift(
    technicianNotification
  );

  localStorage.setItem(
    "techrider_notifications",
    JSON.stringify(allNotifications)
  );

  /* =========================
     TRIGGER LIVE DASHBOARD UPDATE
  ========================= */

  window.dispatchEvent(
    new Event("storage")
  );

  /* =========================
     REMOVE PENDING REQUEST
  ========================= */

  localStorage.removeItem(
    "techrider_pending_request"
  );

  /* =========================
     SHOW SUCCESS MODAL
  ========================= */

  document
    .getElementById("successModal")
    .classList.add("show");

});

/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  document
    .getElementById("successModal")
    .classList.remove("show");

  window.location.href =
    "dashboard-customer.html";

}

document
  .getElementById("closeModalBtn")
  .addEventListener("click", closeModal);

document
  .getElementById("successModal")
  .addEventListener("click", (e) => {

    if(e.target.id === "successModal"){
      closeModal();
    }

});

/* INIT */
renderTechnicians();

</script>

</body>
</html>
