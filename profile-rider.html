<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Rider Profile - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--gray:#f6f6f6;
--white:#fff;
}

body{
background:var(--gray);
padding:20px;
animation:fadeIn .5s ease-in;
overflow-x:hidden;
}

.wrapper{
max-width:1100px;
margin:auto;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
gap:15px;
flex-wrap:wrap;
}

.back-btn{
text-decoration:none;
background:white;
padding:13px 18px;
border-radius:14px;
color:var(--purple);
font-weight:600;
box-shadow:0 5px 16px rgba(0,0,0,.05);
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
background:var(--purple);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:700;
font-size:1.1rem;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* LAYOUT */

.profile-layout{
display:grid;
grid-template-columns:320px 1fr;
gap:24px;
}

/* LEFT SIDEBAR CARD */

.side-card{
background:white;
border-radius:24px;
padding:28px;
box-shadow:0 8px 24px rgba(0,0,0,.05);
height:fit-content;
}

.profile-image-wrap{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.profile-image{
width:120px;
height:120px;
border-radius:50%;
background:var(--purple);
display:flex;
align-items:center;
justify-content:center;
font-size:2rem;
font-weight:700;
color:white;
overflow:hidden;
margin-bottom:16px;
}

.profile-image img{
width:100%;
height:100%;
object-fit:cover;
}

.profile-name{
font-size:1.25rem;
font-weight:700;
color:var(--deep-purple);
}

.profile-role{
margin-top:6px;
color:#777;
font-size:.92rem;
}

.upload-btn{
margin-top:18px;
display:inline-block;
padding:12px 18px;
border-radius:12px;
background:#f3e8ff;
color:var(--purple);
font-weight:600;
cursor:pointer;
font-size:.92rem;
border:none;
}

.upload-btn input{
display:none;
}

/* ACTION BUTTONS */

.action-buttons{
margin-top:30px;
display:flex;
flex-direction:column;
gap:14px;
}

.action-btn{
text-decoration:none;
padding:14px 16px;
border-radius:14px;
display:flex;
align-items:center;
gap:12px;
font-weight:600;
transition:.3s;
}

.jobs-btn{
background:#f3e8ff;
color:var(--purple);
}

.password-btn{
background:linear-gradient(
135deg,
var(--purple),
#c77dff
);
color:white;
}

.logout-btn{
background:#ffe9ec;
color:#d90429;
}

.action-btn:hover{
transform:translateY(-2px);
}

/* MAIN PROFILE CARD */

.profile-card{
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 8px 24px rgba(0,0,0,.05);
}

.section-title{
font-size:1.3rem;
font-weight:700;
color:var(--deep-purple);
margin-bottom:24px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.group{
display:flex;
flex-direction:column;
}

.group label{
margin-bottom:8px;
font-weight:600;
color:#444;
font-size:.95rem;
}

.info-field{
background:#f7f7f7;
padding:15px;
border-radius:14px;
color:#555;
font-size:.95rem;
word-break:break-word;
min-height:54px;
display:flex;
align-items:center;
}

.verify-box{
background:#f3e8ff;
padding:16px;
border-radius:14px;
color:var(--purple);
font-weight:600;
display:flex;
align-items:center;
gap:10px;
}

.verify-box i{
font-size:1rem;
}

/* IMAGE PREVIEW */

.document-preview{
margin-top:12px;
width:100%;
max-width:240px;
border-radius:14px;
overflow:hidden;
border:1px solid #eee;
}

.document-preview img{
width:100%;
display:block;
}

/* MOBILE */

@media(max-width:900px){

.profile-layout{
grid-template-columns:1fr;
}

}

@media(max-width:768px){

body{
padding:15px;
}

.profile-card,
.side-card{
padding:22px;
border-radius:20px;
}

.grid{
grid-template-columns:1fr;
}

.topbar{
align-items:flex-start;
}

.profile-image{
width:100px;
height:100px;
}

}

/* FADE */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="wrapper">

<!-- TOPBAR -->

<div class="topbar">

<a href="dashboard-rider.html"
class="back-btn">
← Back to Dashboard
</a>

<div class="avatar"
id="topAvatar">
R
</div>

</div>

<!-- PROFILE LAYOUT -->

<div class="profile-layout">

<!-- LEFT -->

<div class="side-card">

<div class="profile-image-wrap">

<div class="profile-image"
id="profileImageContainer">
R
</div>

<div class="profile-name"
id="profileName">
Rider Name
</div>

<div class="profile-role">
Verified TechRider Rider
</div>

<label class="upload-btn">
<i class="fas fa-camera"></i>
Upload Profile Image

<input
type="file"
id="profileUpload"
accept="image/*">
</label>

</div>

<div class="action-buttons">

<a href="available-jobs-rider.html"
class="action-btn jobs-btn">
<i class="fas fa-box"></i>
Available Jobs
</a>

<a href="reset-password-customer.html"
class="action-btn password-btn">
<i class="fas fa-lock"></i>
Change Password
</a>

<a href="login-rider.html"
class="action-btn logout-btn"
onclick="logoutRider()">
<i class="fas fa-sign-out-alt"></i>
Logout
</a>

</div>

</div>

<!-- RIGHT -->

<div class="profile-card">

<div class="section-title">
Rider Details & Activities
</div>

<div class="grid">

<div class="group">
<label>Full Name</label>
<div class="info-field"
id="fullName">
-
</div>
</div>

<div class="group">
<label>Email Address</label>
<div class="info-field"
id="email">
-
</div>
</div>

<div class="group">
<label>Phone Number</label>
<div class="info-field"
id="phone">
-
</div>
</div>

<div class="group">
<label>Address</label>
<div class="info-field"
id="address">
-
</div>
</div>

<div class="group">
<label>Plate Number</label>
<div class="info-field"
id="plateNumber">
-
</div>
</div>

<div class="group">
<label>Vehicle Type</label>
<div class="info-field"
id="vehicleType">
-
</div>
</div>

</div>

</div>

</div>

</div>

<script>

/* =========================
CURRENT RIDER
========================= */

const currentRider =
JSON.parse(
localStorage.getItem(
'techrider_current_rider'
)
);

if(!currentRider){

window.location.href =
'login-rider.html';

}

/* =========================
GET ELEMENTS
========================= */

const fullNameEl =
document.getElementById('fullName');

const emailEl =
document.getElementById('email');

const phoneEl =
document.getElementById('phone');

const addressEl =
document.getElementById('address');

const plateEl =
document.getElementById('plateNumber');

const vehicleEl =
document.getElementById('vehicleType');

const profileName =
document.getElementById('profileName');

const topAvatar =
document.getElementById('topAvatar');

const profileImageContainer =
document.getElementById(
'profileImageContainer'
);

/* =========================
POPULATE DETAILS
========================= */

const fullName =
currentRider.fullName ||
'Rider';

const firstName =
fullName.split(' ')[0];

const initials =
firstName.charAt(0).toUpperCase();

fullNameEl.textContent =
fullName;

emailEl.textContent =
currentRider.email || '-';

phoneEl.textContent =
currentRider.phone || '-';

addressEl.textContent =
currentRider.address || '-';

plateEl.textContent =
currentRider.plateNumber || '-';

vehicleEl.textContent =
currentRider.vehicleType || '-';

profileName.textContent =
fullName;

/* =========================
PROFILE IMAGE
========================= */

function renderProfileImage(){

if(currentRider.profileImage){

profileImageContainer.innerHTML = `
<img src="${currentRider.profileImage}">
`;

topAvatar.innerHTML = `
<img src="${currentRider.profileImage}">
`;

}else{

profileImageContainer.textContent =
initials;

topAvatar.textContent =
initials;

}

}

renderProfileImage();

/* =========================
UPLOAD PROFILE IMAGE
========================= */

document.getElementById(
'profileUpload'
).addEventListener(
'change',
function(e){

const file = e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload = function(event){

currentRider.profileImage =
event.target.result;

/* update current rider */
localStorage.setItem(
'techrider_current_rider',
JSON.stringify(currentRider)
);

/* update riders array */
let riders =
JSON.parse(
localStorage.getItem(
'techrider_riders'
)
) || [];

riders = riders.map(rider => {

if(rider.id === currentRider.id){

return {
...rider,
profileImage:
event.target.result
};

}

return rider;

});

localStorage.setItem(
'techrider_riders',
JSON.stringify(riders)
);

renderProfileImage();

};

reader.readAsDataURL(file);

}
);
/* =========================
LOGOUT
========================= */

function logoutRider(){

localStorage.removeItem(
'techrider_current_rider'
);

}

/* =========================
STORAGE LISTENER
========================= */

window.addEventListener(
'storage',
() => {

location.reload();

}
);

</script>

</body>
</html>
