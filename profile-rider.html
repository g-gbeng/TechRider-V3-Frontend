<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>

<title>Rider Profile - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/profile-rider.css">
<script src="js/api.js" data-require-role="rider"></script>
<script src="js/ui.js"></script>
</head>

<body>

<div class="wrapper">

<!-- TOPBAR -->

<div class="topbar">

<a href="dashboard-rider.html"
class="back-btn">
← Back to Dashboard
</a>

<div class="avatar"
id="topAvatar">
R
</div>

</div>

<!-- PROFILE LAYOUT -->

<div class="profile-layout">

<!-- LEFT -->

<div class="side-card">

<div class="profile-image-wrap">

<div class="profile-image"
id="profileImageContainer">
R
</div>

<div class="profile-name"
id="profileName">
Rider Name
</div>

<div class="profile-role">
Verified TechRider Rider
</div>

<label class="upload-btn">
<i class="fas fa-camera"></i>
Upload Profile Image

<input
type="file"
id="profileUpload"
accept="image/*">
</label>
<button type="button" class="tr-remove-photo" id="removePhotoBtn" hidden><i class="fas fa-trash-can"></i> Remove photo</button>

</div>

<div class="action-buttons">

<a href="available-jobs-rider.html"
class="action-btn jobs-btn">
<i class="fas fa-box"></i>
Available Jobs
</a>

<a href="reset-password.html?role=rider"
class="action-btn password-btn">
<i class="fas fa-lock"></i>
Change Password
</a>

<a href="login-rider.html"
class="action-btn logout-btn"
onclick="logoutRider()">
<i class="fas fa-sign-out-alt"></i>
Logout
</a>

</div>

</div>

<!-- RIGHT -->

<div class="profile-card">

<div class="section-title">
Rider Details & Activities
</div>

<div class="grid">

<div class="group">
<label>Full Name</label>
<div class="info-field"
id="fullName">
-
</div>
</div>

<div class="group">
<label>Email Address</label>
<div class="info-field"
id="email">
-
</div>
</div>

<div class="group">
<label>Phone Number</label>
<div class="info-field"
id="phone">
-
</div>
</div>

<div class="group">
<label>Address</label>
<div class="info-field"
id="address">
-
</div>
</div>

<div class="group">
<label>Plate Number</label>
<div class="info-field"
id="plateNumber">
-
</div>
</div>

<div class="group">
<label>Vehicle Type</label>
<div class="info-field"
id="vehicleType">
-
</div>
</div>

</div>

</div>

</div>

</div>
  <div data-theme-picker data-theme-card data-theme-into=".wrapper"></div>

<script src="js/pages/profile-rider.js"></script>

</body>
</html>
