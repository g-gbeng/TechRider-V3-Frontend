<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rider Login - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--purple:#5a189a;
--deep-purple:#240046;
--lilac:#e0aaff;
--white:#fff;
}

body{
background:linear-gradient(135deg,var(--purple),var(--lilac));
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
animation:fadeIn .5s ease-in;
}

.container{
background:var(--white);
max-width:460px;
width:100%;
padding:32px;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.header{
text-align:center;
margin-bottom:25px;
}

.icon{
width:68px;
height:68px;
margin:auto;
border-radius:18px;
background:linear-gradient(135deg,var(--purple),var(--deep-purple));
display:flex;
align-items:center;
justify-content:center;
font-size:1.6rem;
color:white;
}

.header h2{
margin-top:15px;
color:var(--deep-purple);
}

.header p{
font-size:.88rem;
color:#666;
margin-top:6px;
}

/* SIGNUP LINK */
.signup-wrap{
text-align:center;
margin-bottom:18px;
font-size:.85rem;
color:#000;
}

.signup-wrap a{
color:var(--purple);
text-decoration:none;
font-weight:500;
}

/* FORM */
.form-group{
margin-bottom:16px;
}

label{
display:block;
margin-bottom:6px;
font-size:.86rem;
font-weight:500;
color:#333;
}

input{
width:100%;
padding:13px 14px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
font-size:.95rem;
}

input:focus{
border-color:var(--purple);
}

/* PASSWORD */
.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:48px;
}

.toggle{
position:absolute;
top:50%;
right:15px;
transform:translateY(-50%);
cursor:pointer;
color:#666;
}

.bottom-link {
text-align: center;
margin-top: 14px;
font-size: 0.85rem;
}

.bottom-link a {
color: var(--purple);
text-decoration: none;
font-weight: 500;
}

.bottom-link a:hover {
text-decoration: underline;
}

/* FORGOT */
.forgot{
display:block;
text-align:left;
font-size:.82rem;
margin-top:8px;
text-decoration:none;
color:var(--purple);
}

/* BUTTON */
button{
width:100%;
border:none;
padding:14px;
border-radius:12px;
background:linear-gradient(135deg,var(--purple),var(--lilac));
color:white;
font-weight:600;
cursor:pointer;
margin-top:15px;
}

@media(max-width:540px){
.container{
padding:22px;
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>


</head>
<body>

<div class="container">

<div class="header">
<div class="icon">
<i class="fas fa-motorcycle"></i>
</div>

<h2>Rider Login</h2>
<p>Welcome back to TechRider</p>
</div>

<div class="signup-wrap">
Don't have an account?
<a href="signup-rider.html">Sign up</a>
</div>

<form action="awaiting-approval-rider.html">

<div class="form-group">
<label>Email Address</label>
<input
type="email"
required>
</div>

<div class="form-group">
<label>Password</label>

<div class="password-wrap">
<input
type="password"
id="password"
required
oninvalid="this.setCustomValidity('Enter your account password. It must contain at least 8 characters, one uppercase letter, one number and one special character.')"
oninput="this.setCustomValidity('')"
>

<i class="fas fa-eye toggle"
onclick="togglePassword('password',this)">
</i>

</div>

<a href="forgot-password-rider.html" class="forgot">
Forgot Password?
</a>

</div>

<button type="submit">
Log In
</button>

</form>

<div class="bottom-link">
      Secure access for TechRider dispatch
    </div>
</div>

<script>
function togglePassword(id,icon){
const field=document.getElementById(id);

if(field.type==="password"){
field.type="text";
icon.classList.replace("fa-eye","fa-eye-slash");
}else{
field.type="password";
icon.classList.replace("fa-eye-slash","fa-eye");
}
}
</script>

</body>
</html>
