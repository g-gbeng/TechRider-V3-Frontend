<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rider Login - TechRider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages/login-rider.css">

</head>
<body>

<div class="container">

<div class="header">

<div class="icon">
<i class="fas fa-motorcycle"></i>
</div>

<h2>Rider Login</h2>

<p>
Welcome back to TechRider
</p>

</div>

<div class="signup-wrap">

Don't have an account?

<a href="signup-rider.html">
Sign up
</a>

</div>

<form id="loginForm">

<div class="form-group">

<label for="email">Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

</div>

<div class="form-group">

<label for="password">Password</label>

<div class="password-wrap">

<input
type="password"
id="password"
required
oninvalid="this.setCustomValidity('Enter your account password. It must contain at least 8 characters, one uppercase letter, one number and one special character.')"
oninput="this.setCustomValidity('')"
>

<i class="fas fa-eye toggle"
onclick="togglePassword('password',this)">
</i>

</div>

<a href="forgot-password.html?role=rider" class="forgot">
Forgot Password?
</a>

</div>

<button type="submit">
Log In
</button>

<div
class="errorMessage"
id="errorMessage"
></div>

<div
class="successMessage"
id="successMessage"
></div>

<div
class="login-message"
id="pendingMessage"
></div>


</form>

<div class="bottom-link">
Secure access for TechRider dispatch
</div>

</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login-rider.js"></script>

</body>
</html>
