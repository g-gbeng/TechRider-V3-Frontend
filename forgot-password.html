<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#240046">
  <script src="js/theme.js"></script>
  <title>TechRider - Forgot Password</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/forgot-password.css">
</head>
<body>
<button data-theme-toggle class="tr-theme-floating" aria-label="Theme"></button>

  <div class="container">

    <div class="header">
      <div class="icon">
        <i class="fas fa-envelope"></i>
      </div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <form id="forgotForm">
      <label for="email">Email Address</label>
      <input id="email" type="email" autocomplete="email" placeholder="Enter your registered email" required />

      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <div class="sent-box" id="sentBox" hidden role="status">
      <i class="fas fa-paper-plane"></i>
      <h3>Check your email</h3>
      <p id="sentText"></p>
    </div>

    <div class="back-link">
      Remember your password? <a href="login-customer.html" id="loginLink">Log in</a>
    </div>

  </div>

  <script src="js/api.js"></script>
<script src="js/ui.js"></script>
  <script src="js/pages/forgot-password.js"></script>

</body>
</html>
